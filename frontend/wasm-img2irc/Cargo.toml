[package]
name = "wasm-img2irc"
version = "0.1.0"
edition = "2021"
description = "WASM acceleration for img2irc — bilateral filter, OKLab, Viterbi"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd"]
