---
- name: Discover this host's Tailscale IPv4 address
  tags: [always]
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_raw
  changed_when: false
  failed_when: tailscale_ip_raw.rc != 0
  check_mode: false

- name: Set host_tailscale_ip fact
  tags: [always]
  ansible.builtin.set_fact:
    host_tailscale_ip: "{{ tailscale_ip_raw.stdout | trim | split('\n') | first | trim }}"

- name: Resolve backend Tailscale IP (where mongo & redis live)
  tags: [always]
  ansible.builtin.set_fact:
    backend_tailscale_ip: >-
      {{ hostvars[groups['ircfiber_backend'][0]]['backend_tailscale_ip']
         | default(hostvars[groups['ircfiber_backend'][0]]['host_tailscale_ip']
            | default(host_tailscale_ip)) }}

- name: Pull irc-fiber image (registry-qualified ref only)
  # Every side-container tag needs this too: without the pull, `-t <bot>`
  # builds the container from whatever :prod the host happens to have
  # cached, which is the release *before* the one just shipped.
  tags: [gateway, bnc, support-bot, fibereye]
  community.docker.docker_image:
    name: "{{ ircfiber_gateway_image_full }}"
    source: pull
    force_source: true
    state: present
  # gateway-deploy.yml hands this role a plain local tag
  # (irc-fiber-gateway:deploy) it has already pulled by digest and tagged;
  # a pull of that would go to Docker Hub and fail.
  when: "'/' in ircfiber_gateway_image_full"

- name: Ensure ircfiber config dir exists
  tags: [always]
  ansible.builtin.file:
    path: /etc/ircfiber/gateway
    state: directory
    owner: root
    group: root
    mode: "0750"

# Secrets are installed as individual 0400 root-owned files under
# {{ gateway_secrets_dir }} and reach the process through the *_FILE env
# indirection, so no credential appears in the container env or in
# `docker inspect`. Must run before env.j2 is rendered: that template emits
# the *_FILE paths pointing at these files.
- name: Install gateway secret files
  tags: [always]
  ansible.builtin.include_tasks: secrets.yml

- name: Render gateway env file
  tags: [always]
  # The rendered file still carries connection URLs with embedded
  # credentials, and a template diff would print them into the deploy log
  # (and into whatever CI captures that log).
  no_log: true
  ansible.builtin.template:
    src: env.j2
    dest: /etc/ircfiber/gateway/env
    owner: root
    group: root
    mode: "0640"
  notify: Restart gateway replicas

- name: Ensure uploads & logs volumes exist
  tags: [always]
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ gateway_uploads_volume }}"
    - "{{ gateway_logs_volume }}"

- name: Resolve the ircfiber network name
  tags: [always]
  ansible.builtin.set_fact:
    ircfiber_networks_for_gateway:
      - name: "{{ docker_ircfiber_network }}"
      # Join the logging network so the gateway can push OTLP traces
      # to the otel-collector. Required for distributed tracing.
      - name: ircfiber_logging

- name: Set facts for gateway replica deployment
  tags: [always]
  ansible.builtin.set_fact:
    _gw_container_names: "{{ ['ircfiber-gateway'] if (gateway_replica_count | int) == 1 else (range(gateway_replica_count | int) | map('regex_replace', '^', 'ircfiber-gateway-') | list) }}"

# Read env_file into a dict and pass via env: (NOT env_file:) so the
# docker_container module compares values against the running container
# and recreates it when env content drifts. With env_file: the module
# never compares values, which is how the gateway got stuck with a stale
# MONGO_URL after a vault rotation on 2026-07-04 (real outage).
- name: Slurp gateway env file from target
  tags: [always]
  ansible.builtin.slurp:
    src: /etc/ircfiber/gateway/env
  register: _gateway_env_raw

- name: Parse gateway env into a dict
  tags: [always]
  vars:
    _raw_lines: "{{ (_gateway_env_raw.content | b64decode).split('\n') | reject('match', '^\\s*#') | map('trim') | reject('equalto', '') | list }}"
    _pairs: "{{ _raw_lines | map('split', '=', 1) | list }}"
  ansible.builtin.set_fact:
    _gateway_env: "{{ dict(_pairs) }}"

# Every container below is defined by tasks/container.yml — one spec, four
# call sites (these three plus the green replica in
# playbooks/gateway-deploy.yml). The per-component differences are passed
# in as vars; nothing about the image, env, mounts, ulimits, security
# options, limits or health probe is restated here, because the copy that
# used to live in the blue/green playbook drifted and silently dropped a
# mount on every swap.
# `apply:` is what makes `-t gateway` / `-t bnc` / `-t support-bot` work: a
# tag on a dynamic include only decides whether the include itself runs, and
# the tasks inside container.yml carry no tags of their own — so a tagged run
# printed the include and then silently created nothing (which is exactly how
# `-t bnc,support-bot` reported changed=0 while both containers were gone).
- name: Run ircfiber-gateway replicas
  tags: [gateway]
  ansible.builtin.include_tasks:
    file: container.yml
    apply:
      tags: [gateway]
  loop: "{{ _gw_container_names }}"
  loop_control:
    loop_var: gateway_spec_name
  vars:
    gateway_spec_component: "gateway"

# Bouncer listener: same image, dedicated container so the public TCP
# port is independent of the HTTP gateway replicas (not part of blue/green).
# TLS uses the LE cert Caddy obtained for bnc_public_host; the Caddy data
# volume is mounted read-only and the cert is re-read per connection.
- name: Run ircfiber-bnc
  tags: [bnc]
  ansible.builtin.include_tasks:
    file: container.yml
    apply:
      tags: [bnc]
  vars:
    gateway_spec_name: "{{ bnc_container_name }}"
    gateway_spec_component: "bnc"
    gateway_spec_env_extra:
      IRCFIBER_BNC_PORT: "{{ bnc_public_port | string }}"
      IRCFIBER_BNC_TLS_CERT: "{{ bnc_tls_cert_path }}"
      IRCFIBER_BNC_TLS_KEY: "{{ bnc_tls_key_path }}"
    gateway_spec_ports:
      - "{{ bnc_public_port }}:{{ bnc_public_port }}"
    # Caddy's cert store plus the ircd config; explicitly no Anope data
    # volume, since bnc serves no admin routes.
    gateway_spec_volumes_extra:
      - "{{ caddy_data_volume }}:/caddy-data:ro"
      - "{{ ircd_conf_dir | default('/etc/ircfiber/ircd') }}:/etc/ircfiber/ircd:ro"
    gateway_spec_memory: "{{ bnc_memory_limit }}"
    gateway_spec_memory_reservation: "{{ bnc_memory_reservation }}"
    gateway_spec_cpus: "{{ bnc_cpus }}"
    gateway_spec_oom_score_adj: "{{ bnc_oom_score_adj }}"
  when: bnc_enabled | default(false) | bool

# #support services bot: same image, dedicated container (not part of
# blue/green, no published ports). Only this process sets
# IRCFIBER_SUPPORT_BOT_ENABLED; it reaches the ircd through the docker alias
# already rendered as IRCFIBER_IRCD_HOST/PORT in the gateway env. Its
# NickServ password is NOT injected here: env.j2 renders
# IRCFIBER_SUPPORT_BOT_NICKSERV_PASSWORD_FILE and the value lives in a 0400
# file under {{ gateway_secrets_dir }}, so it stays out of `docker inspect`.
- name: Run ircfiber-support-bot
  tags: [support-bot]
  ansible.builtin.include_tasks:
    file: container.yml
    apply:
      tags: [support-bot]
  vars:
    gateway_spec_name: "{{ support_bot_container_name }}"
    gateway_spec_component: "support-bot"
    gateway_spec_env_extra:
      IRCFIBER_SUPPORT_BOT_ENABLED: "1"
      # The bot's port falls back to IRCFIBER_IRCD_PORT — the TLS port on
      # this host — while its own TLS flag defaults to off, so without this
      # it dials 6697 in plaintext, the ircd drops it ("Connection closed
      # while writing data") and it reconnects forever without ever joining.
      IRCFIBER_SUPPORT_BOT_TLS: "{{ _gateway_env['IRCFIBER_IRCD_TLS'] | default('0') }}"
      IRCFIBER_SUPPORT_BOT_NICK: "{{ support_bot_nick }}"
      IRCFIBER_SUPPORT_BOT_CHANNEL: "{{ support_bot_channel }}"
      IRCFIBER_SUPPORT_BOT_PUBLIC_URL: "{{ support_bot_public_url }}"
      # `!adduser`/`!nsinfo` verify via Anope XML-RPC as the oper account
      # (same listener/account as the gateway — inherited from _gateway_env,
      # restated here so the dependency is explicit).
      IRCFIBER_ANOPE_RPC_URL: "{{ _gateway_env['IRCFIBER_ANOPE_RPC_URL'] | default('') }}"
      IRCFIBER_ANOPE_RPC_TIMEOUT: "{{ _gateway_env['IRCFIBER_ANOPE_RPC_TIMEOUT'] | default('10') }}"
      IRCFIBER_ANOPE_OPER_ACCOUNT: "{{ _gateway_env['IRCFIBER_ANOPE_OPER_ACCOUNT'] | default('') }}"
      # Fallback oper allowlist when the ircd omits 313 (comma nicks, empty = WHOIS only).
      IRCFIBER_SUPPORT_BOT_ADDUSER_ALLOW: "{{ support_bot_adduser_allow | default('') }}"
    # Base mounts only — no ircd config, no Anope data, no cert store.
    gateway_spec_volumes_extra: []
    gateway_spec_memory: "{{ support_bot_memory_limit }}"
    gateway_spec_memory_reservation: "{{ support_bot_memory_reservation }}"
    gateway_spec_cpus: "{{ support_bot_cpus }}"
    gateway_spec_oom_score_adj: "{{ support_bot_oom_score_adj }}"
  when: support_bot_enabled | default(false) | bool

# The retired #staff log bot (FiberLogs). FiberEye announces in #staff now;
# a leftover container would double-announce and OPER as a removed oper.
- name: Remove the retired ircfiber-logs-bot container
  tags: [fibereye, logs-bot]
  community.docker.docker_container:
    name: ircfiber-logs-bot
    state: absent

# FiberEye connection watch + #staff announcer: same image, dedicated
# container (not part of blue/green, no published ports). Only this process
# sets IRCFIBER_FIBEREYE_ENABLED; it opens an opered IRC connection to the
# ircd through the docker alias already rendered as IRCFIBER_IRCD_HOST/PORT
# in the gateway env, joins #staff, persists every connect and quit, builds
# the IP intelligence record and announces the outbox. Its NickServ/oper
# passwords and the intel API keys are NOT injected here: env.j2 renders the
# *_FILE paths and the values live in 0400 files under
# {{ gateway_secrets_dir }}, so they stay out of `docker inspect`.
# Enforcement is still gated at runtime by the Redis key `fibereye:armed`;
# creating this container arms nothing.
- name: Run ircfiber-fibereye
  tags: [fibereye]
  ansible.builtin.include_tasks:
    file: container.yml
    apply:
      tags: [fibereye]
  vars:
    gateway_spec_name: "{{ fibereye_container_name }}"
    gateway_spec_component: "fibereye"
    gateway_spec_env_extra:
      IRCFIBER_FIBEREYE_ENABLED: "1"
      # Same trap as the support and log bots: the port falls back to
      # IRCFIBER_IRCD_PORT (the TLS port) while the bot's own TLS flag
      # defaults to off, so without this it dials 6697 in plaintext.
      IRCFIBER_FIBEREYE_TLS: "{{ _gateway_env['IRCFIBER_IRCD_TLS'] | default('0') }}"
      IRCFIBER_FIBEREYE_NICK: "{{ fibereye_nick }}"
      IRCFIBER_FIBEREYE_CHANNEL: "{{ fibereye_channel }}"
      IRCFIBER_FIBEREYE_CHANNELS: "#staff,#ircfiber"
      IRCFIBER_FIBEREYE_IGNORE_CLASSES: "{{ fibereye_ignore_classes }}"
      IRCFIBER_FIBEREYE_EXEMPT_IPS: "{{ fibereye_exempt_ips | default('') }}"
      IRCFIBER_FIBEREYE_WINDOW: "{{ fibereye_window | string }}"
      IRCFIBER_FIBEREYE_CONNECT_THRESHOLD: "{{ fibereye_connect_threshold | string }}"
      IRCFIBER_FIBEREYE_NICK_THRESHOLD: "{{ fibereye_nick_threshold | string }}"
      IRCFIBER_FIBEREYE_CHURN_THRESHOLD: "{{ fibereye_churn_threshold | string }}"
      IRCFIBER_FIBEREYE_SHORT_MS: "{{ fibereye_short_ms | string }}"
      IRCFIBER_FIBEREYE_BAN_SECONDS: "{{ fibereye_ban_seconds | string }}"
    # Base mounts only — no ircd config, no Anope data, no cert store.
    gateway_spec_volumes_extra: []
    gateway_spec_memory: "{{ fibereye_memory_limit }}"
    gateway_spec_memory_reservation: "{{ fibereye_memory_reservation }}"
    gateway_spec_cpus: "{{ fibereye_cpus }}"
    gateway_spec_oom_score_adj: "{{ fibereye_oom_score_adj }}"
  when: fibereye_enabled | default(false) | bool
