---
# Secret material for the gateway / bnc / support-bot containers.
#
# WHY files instead of env vars: everything in a container's environment is
# printed in cleartext by `docker inspect <container>`, echoed by Ansible and
# `docker compose config`, and copied into every transcript or bug report that
# pastes an inspect. Until 2026-09-06 that meant the Mongo application
# password, the IRCd oper password, the SigNoz service-account key and the
# #support bot's NickServ password were one command away from anyone with
# access to the docker socket.
#
# So each secret is written to its own root-owned 0400 file under
# `gateway_secrets_dir`, that directory is bind-mounted read-only into the
# containers (see tasks/container.yml), and the env carries only the path as
# `<VAR>_FILE` (templates/env.j2). The backend prefers `<VAR>_FILE` over the
# inline `<VAR>` (ircfiber.env.envSecret), so a host that still has a stale
# inline value uses the file the deploy intends.
#
# 0400 root is readable inside the containers because they run as uid 0; do
# not loosen the mode for a future non-root container user — add that uid to
# the file's group instead.
#
# Every task that touches a value carries no_log: true. The `content:` of an
# ansible.builtin.copy is logged verbatim otherwise, and a loop additionally
# prints its item, which here *is* the secret.

- name: Ensure the gateway secrets directory exists
  tags: [always]
  ansible.builtin.file:
    path: "{{ gateway_secrets_dir | default('/etc/ircfiber/gateway/secrets') }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Materialise the gateway secret files
  tags: [always]
  vars:
    _gateway_secrets_dir: "{{ gateway_secrets_dir | default('/etc/ircfiber/gateway/secrets') }}"
    # The Mongo connection string is assembled here, not in env.j2, so the
    # password never passes through the rendered env file at all.
    #
    # Passwords are URL-encoded: the D libraries (vibe-d) decode
    # percent-encoded characters in the connection-string userinfo, so
    # urlencode is the right transform. Caveat: keep the underlying passwords
    # URL-safe (alphanumeric).
    #
    # IMPORTANT: the D gateway/engine URL parser uses `lastIndexOf("/")` to
    # extract the database name, so anything after the last `/` is treated as
    # the DB name. Do NOT add `?authSource=...` query params — they get
    # concatenated to the DB name. The user lives in the ircfiber DB so the
    # default authSource is correct.
    _gateway_secrets:
      - name: mongo_url
        value: "mongodb://{{ vault_mongo_app_username | urlencode }}:{{ vault_mongo_app_password | urlencode }}@{{ backend_tailscale_ip | default(host_tailscale_ip | default('127.0.0.1')) }}:{{ mongo_port }}/{{ mongo_initdb_database }}"
      - name: ircd_oper_password
        value: "{{ vault_ircd_dashboard_password | default('') }}"
      - name: signoz_api_key
        value: "{{ vault_signoz_api_key | default('') }}"
      - name: k3s_backup_token
        value: "{{ vault_k3s_backup_token | default('') }}"
      - name: support_bot_nickserv_password
        value: "{{ vault_support_bot_nickserv_password | default('') }}"
      # Session signing key. An empty value here removes the file, and the
      # backend then falls back to a random per-process key: sessions still
      # cannot be forged, but everyone is logged out on every restart.
      - name: jwt_secret
        value: "{{ vault_ircfiber_jwt_secret | default('') }}"
  no_log: true
  block:
    # envSecret() strips trailing whitespace, so the newline `content:`
    # appends is harmless.
    - name: Write the gateway secret files
      ansible.builtin.copy:
        dest: "{{ _gateway_secrets_dir }}/{{ item.name }}"
        content: "{{ item.value }}"
        owner: root
        group: root
        mode: "0400"
      when: item.value | length > 0
      loop: "{{ _gateway_secrets }}"
      no_log: true
      notify: Restart gateway replicas

    # A secret emptied in the vault (the SigNoz key was never minted, a
    # credential was retired) must not linger on disk: the file always wins
    # over the env, so a stale file would outlive the rotation. Removing it
    # makes the backend report "not configured" instead of authenticating
    # with a dead credential.
    - name: Remove secret files whose value is now empty
      ansible.builtin.file:
        path: "{{ _gateway_secrets_dir }}/{{ item.name }}"
        state: absent
      when: item.value | length == 0
      loop: "{{ _gateway_secrets }}"
      no_log: true
      notify: Restart gateway replicas
