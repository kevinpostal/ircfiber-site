  tags: [ircdconf]

- name: Set FiberEye oper password hash fact
  ansible.builtin.set_fact:
    ircd_fibereye_oper_hash: "{{ ircd_fibereye_oper_hash_raw.stdout | trim }}"
  no_log: true
  tags: [ircdconf]
