  no_log: true
  tags: [ircdconf]

# FiberEye connection-watch oper (EyeWatch class: ZLINE + STATS only, plus
# umode +s with snomasks c/q/x so it sees every connect and quit). Rotated
# independently of the human, dashboard and log-bot opers.
- name: Compute InspIRCd hmac-sha256 FiberEye oper password hash
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/inspircd_hmac.py"
