---
# InspIRCd 4 spanningtree leaf on k3s. Renders the hub's own templates in
# leaf mode onto the k3s node (hostPath, because a k8s Secret cannot be
# created on this cluster and PVCs do not bind under its disk-pressure
# taint), applies the manifests, and SIGHUPs the running pod.
#
# Entry point: playbooks/ircd-k8s-leaf.yml

- name: Compute InspIRCd oper password hashes
  ansible.builtin.import_tasks: oper_hashes.yml

- name: Ensure leaf conf and data dirs exist on the k3s node
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ircd_container_uid }}"
    group: "{{ ircd_container_uid }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ircd_k8s_conf_dir }}", mode: "0750" }
    - { path: "{{ ircd_k8s_conf_dir }}/motd.d", mode: "0755" }
    - { path: "{{ ircd_k8s_data_dir }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Render leaf InspIRCd config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ircd_k8s_conf_dir }}/{{ item.dest }}"
    owner: "{{ ircd_container_uid }}"
    group: "{{ ircd_container_uid }}"
    mode: "{{ item.mode | default('0640') }}"
  loop:
    - { src: inspircd.conf.j2, dest: inspircd.conf }
    - { src: custom.conf.j2, dest: custom.conf }
    - { src: modules.conf.j2, dest: modules.conf }
    - { src: opers.conf.j2, dest: opers.conf }
    - { src: motd.j2, dest: motd.d/motd, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Rehash k8s ircd

# The leaf runs our own ircd image (ghcr.io/…/irc-fiber-ircd, private
# package), so the pod needs a pull secret. Same GHCR credentials the
# registry_login role uses on OVH. `create --dry-run | apply` makes the task
# idempotent; the manifest references it as imagePullSecrets ghcr-pull.
- name: Ensure the GHCR pull secret exists in the leaf namespace
  ansible.builtin.shell: >-
    kubectl --context {{ ircd_k8s_context }} --namespace {{ ircd_k8s_namespace }}
    create secret docker-registry ghcr-pull
    --docker-server={{ docker_registry_url }}
    --docker-username={{ vault_docker_registry_username | quote }}
    --docker-password={{ vault_docker_registry_password | quote }}
    --dry-run=client -o yaml
    | kubectl --context {{ ircd_k8s_context }} --namespace {{ ircd_k8s_namespace }} apply -f -
  delegate_to: localhost
  become: false
  register: ircd_k8s_pull_secret
  changed_when: "'configured' in ircd_k8s_pull_secret.stdout or 'created' in ircd_k8s_pull_secret.stdout"
  no_log: true

- name: Apply the leaf manifests
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ ircd_k8s_context }}"
      - --namespace
      - "{{ ircd_k8s_namespace }}"
      - apply
      - -f
      - "{{ playbook_dir }}/../k8s/ircfiber-prod/deployment-ircd-leaf.yaml"
  delegate_to: localhost
  become: false
  register: ircd_k8s_apply
  changed_when: "'created' in ircd_k8s_apply.stdout or 'configured' in ircd_k8s_apply.stdout"

- name: Wait for the leaf rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ ircd_k8s_context }}"
      - --namespace
      - "{{ ircd_k8s_namespace }}"
      - rollout
      - status
      - deployment/ircfiber-ircd-k8s
      - --timeout=300s
  delegate_to: localhost
  become: false
  changed_when: false
