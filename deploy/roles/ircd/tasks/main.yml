---
# IRC Fiber — Deploy InspIRCd 4 + Anope 2 services
#
# Containers (both on {{ docker_ircfiber_network }}):
#   ircfiber-ircd      inspircd/inspircd-docker  aliases: ircd, irc.ircfiber.com
#                      ports 6667 (plain) / 6697 (TLS) published; 7000 (links) internal
#   ircfiber-services  anope/anope               alias: services (links to ircd:7000)

- name: Preflight — vault secrets must be set
  ansible.builtin.assert:
    that:
      - vault_ircd_oper_password is defined
      - vault_ircd_oper_password | length > 0
      - vault_ircd_oper_password != "REPLACE-WITH-STRONG-PASSWORD"
      - vault_ircd_services_link_password is defined
      - vault_ircd_services_link_password | length >= 16
      - vault_ircd_netcrave_link_password is defined
      - vault_ircd_netcrave_link_password | length >= 16
      - vault_ircd_netcrave_link_password != "REPLACE-WITH-NETCRAVE-LINK-SECRET"
      - vault_ircd_k8s_link_password is defined
      - vault_ircd_k8s_link_password | length >= 16
      - vault_ircd_k8s_link_password != "REPLACE-WITH-K8S-LINK-SECRET"
      - vault_ircd_cloak_key is defined
      - vault_ircd_cloak_key | length >= 30
      - vault_ircd_dashboard_password is defined
      - vault_ircd_dashboard_password | length > 0
      - vault_ircd_dashboard_password != "REPLACE-WITH-STRONG-PASSWORD"
      - vault_ircd_fibereye_oper_password is defined
      - vault_ircd_fibereye_oper_password | length > 0
      - vault_ircd_fibereye_oper_password != "REPLACE-WITH-STRONG-PASSWORD"
      - vault_ircd_webirc_password is defined
      - vault_ircd_webirc_password | length >= 16
      - vault_ircd_webirc_password != "REPLACE-WITH-STRONG-PASSWORD"
    fail_msg: |
      vault_ircd_oper_password, vault_ircd_services_link_password (>=16 chars),
      vault_ircd_netcrave_link_password (>=16 chars, not the placeholder),
      vault_ircd_k8s_link_password (>=16 chars, not the placeholder; the
      OVH hub <-> k3s leaf spanningtree link),
      vault_ircd_cloak_key (>=30 chars), vault_ircd_dashboard_password
      (admin dashboard oper, used by the gateway IRCFIBER_IRCD_OPER_PASSWORD),
      vault_ircd_fibereye_oper_password (FiberEye connection-watch and
      #staff announcer oper, used by the ircfiber-fibereye container)
      and vault_ircd_webirc_password (>=16 chars; the WEBIRC password the
      engine presents, IRCFIBER_IRCD_WEBIRC_PASSWORD)
      must be set in inventories/production/group_vars/vault.yml:
        ansible-vault edit inventories/production/group_vars/vault.yml

# Oper password hashes. Extracted so the k3s leaf play can reuse them: the
# salt label embeds the server name, so each server hashes its own.
- name: Compute InspIRCd oper password hashes
  ansible.builtin.import_tasks: oper_hashes.yml

- name: Ensure data volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ ircd_data_volume }}"
    - "{{ ircd_services_data_volume }}"

- name: Pull images (registry-qualified refs only)
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
    state: present
  loop:
    - "{{ ircd_image }}"
    - "{{ ircd_services_image }}"
  # ircd-deploy.yml hands this role a plain local tag (ircfiber-ircd:deploy)
  # it has already pulled by digest and tagged; a pull of that would go to
  # Docker Hub and fail.
  when: "'/' in item"

# The InspIRCd image runs as uid 10000 and its entrypoint writes the
# self-signed cert/key/dhparams into the conf dir on first boot.
- name: Ensure InspIRCd config dir exists (owned by container uid)
  ansible.builtin.file:
    path: "{{ ircd_conf_dir }}"
    state: directory
    owner: "{{ ircd_container_uid }}"
    group: "{{ ircd_container_uid }}"
    mode: "0750"

- name: Ensure Anope config dir exists
  ansible.builtin.file:
    path: "{{ ircd_services_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove legacy Ergo config
  ansible.builtin.file:
    path: "{{ ircd_conf_dir }}/ircd.yaml"
    state: absent

# The MOTD lives in its own subdir so the gateway can be handed write
# access to just that (rw bind mount of motd.d, see roles/gateway/tasks/
# container.yml) for the admin MOTD rotation, without ever being able to
# touch opers.conf & co. The ircd (uid 10000) only needs to read it, and
# the gateway writes as root, hence world-readable dir + file.
- name: Ensure InspIRCd motd.d exists
  ansible.builtin.file:
    path: "{{ ircd_conf_dir }}/motd.d"
    state: directory
    owner: "{{ ircd_container_uid }}"
    group: "{{ ircd_container_uid }}"
    mode: "0755"
  tags: [ircdconf]

  # Timestamped pre-save backups for the admin Config tab
  # (POST /api/admin/ircd/config, see web/admin/ircd.d). The gateway writes
  # as root, same as the motd.d pool writes, hence root-owned 0750.
- name: Ensure InspIRCd admin-bak exists
  ansible.builtin.file:
    path: "{{ ircd_conf_dir }}/admin-bak"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [ircdconf]

- name: Remove legacy top-level motd
  ansible.builtin.file:
    path: "{{ ircd_conf_dir }}/motd"
    state: absent
  tags: [ircdconf]

- name: Render InspIRCd config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ircd_conf_dir }}/{{ item.dest }}"
    owner: "{{ ircd_container_uid }}"
    group: "{{ ircd_container_uid }}"
    mode: "{{ item.mode | default('0640') }}"
    # Rendered once; after that the gateway's MOTD rotation owns the file.
    force: "{{ item.force | default(true) }}"
  loop:
    - { src: custom.conf.j2, dest: custom.conf }
    - { src: opers.conf.j2, dest: opers.conf }
    - { src: rules.j2, dest: rules.txt }
    # 0644, like the file the gateway's MOTD rotation writes in its place;
    # never re-rendered over a rotated MOTD.
    - { src: motd.j2, dest: motd.d/motd, mode: "0644", force: false }
  loop_control:
    label: "{{ item.dest }}"
  # Tagged so the config can be re-rendered and rehashed on its own:
  #   ansible-playbook -l <host> playbooks/ircd.yml -t ircdconf
  # A full role run would also reconcile the container spec and therefore
  # RECREATE the ircd, disconnecting every user on the network. SIGHUP rehash
  # (see the handler) applies config with nobody dropped, so config-only
  # changes must never need a window.
  tags: [ircdconf]
  notify: Rehash ircd

  # inspircd.conf / modules.conf are editable from the admin Config tab, so
  # they render through guarded_conf.yml: never installed over admin edits
  # unless ircd_config_force=true (see defaults/main.yml). motd.d/motd keeps
  # force:false above and needs nothing.
- name: Render guarded InspIRCd config
  ansible.builtin.include_tasks: guarded_conf.yml
  loop:
    - { src: inspircd.conf.j2, dest: inspircd.conf }
    - { src: modules.conf.j2, dest: modules.conf }
  loop_control:
    loop_var: conf
    label: "{{ conf.dest }}"
  tags: [ircdconf]

- name: Render Anope config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ircd_services_conf_dir }}/{{ item.dest }}"
    owner: "{{ ircd_container_uid }}"
    group: "{{ ircd_container_uid }}"
    mode: "0640"
  loop:
    - { src: services.conf.j2, dest: services.conf }
    - { src: nickserv.conf.j2, dest: nickserv.conf }
    - { src: global.conf.j2, dest: global.conf }
    - { src: operserv.conf.j2, dest: operserv.conf }
    - { src: motd.j2, dest: services.motd }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart services

# Managed TLS: copy the Caddy-issued LE cert/key for {{ ircd_server_name }}
# into the conf dir owned by the container uid. A direct volume mount is
# not used because the image runs as uid 10000 and Caddy's key files are
# root-owned; the host-side copy keeps the existing 0640/uid convention.
# Fail fast with a clear message when Caddy has not issued the cert yet
# (deploy the caddy role with the irc hostname in caddy_acme_hosts first).
# The rendered sslprofile points at these files, so InspIRCd fails to boot
# without them — this task must run before the container is (re)started.
- name: Install LE TLS sync script
  ansible.builtin.copy:
    dest: /usr/local/sbin/ircfiber-ircd-tls-sync
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/bin/sh
      # Sync Caddy-issued LE cert/key into the InspIRCd conf dir.
      # Prints CHANGED when files were installed, UNCHANGED otherwise.
      set -eu
      SRC_CRT="{{ ircd_le_cert_src }}"
      SRC_KEY="{{ ircd_le_key_src }}"
      DEST_CRT="{{ ircd_conf_dir }}/{{ ircd_tls_cert_file }}"
      DEST_KEY="{{ ircd_conf_dir }}/{{ ircd_tls_key_file }}"
      tmpd="$(mktemp -d)"
      trap 'rm -rf "$tmpd"' EXIT
      if ! docker run --rm \
        -v "{{ caddy_data_volume }}:/caddy-data:ro" \
        -v "$tmpd:/out" \
        "{{ ircd_cert_sync_image }}" \
        sh -c "test -f \"$SRC_CRT\" && test -f \"$SRC_KEY\" \
          && cp \"$SRC_CRT\" /out/tls-cert.pem \
          && cp \"$SRC_KEY\" /out/tls-key.pem"; then
        echo "LE cert for {{ ircd_server_name }} not yet issued."
        echo "Deploy the caddy role with '{{ ircd_server_name }}' in caddy_acme_hosts,"
        echo "port 80 reachable, then re-run this playbook."
        exit 1
      fi
      if [ -f "$DEST_CRT" ] && [ -f "$DEST_KEY" ] \
        && cmp -s "$tmpd/tls-cert.pem" "$DEST_CRT" \
        && cmp -s "$tmpd/tls-key.pem" "$DEST_KEY"; then
        echo "UNCHANGED"
      else
        # NOTE: install -o/-g needs a resolvable username, and uid 10000
        # exists only inside the container — so install as root, then
        # chown with numeric IDs (chown accepts those unconditionally).
        install -m 0640 "$tmpd/tls-cert.pem" "$DEST_CRT"
        install -m 0640 "$tmpd/tls-key.pem" "$DEST_KEY"
        chown "{{ ircd_container_uid }}:{{ ircd_container_uid }}" \
          "$DEST_CRT" "$DEST_KEY"
        echo "CHANGED"
      fi
  when: ircd_tls_mode == "letsencrypt"

- name: Sync LE cert into ircd conf dir
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/ircfiber-ircd-tls-sync
  register: ircd_tls_sync
  changed_when: "'CHANGED' in ircd_tls_sync.stdout"
  notify: Rehash ircd
  when: ircd_tls_mode == "letsencrypt"

- name: Daily LE cert renewal check
  ansible.builtin.cron:
    name: "ircfiber ircd TLS sync"
    hour: "{{ ircd_tls_sync_cron_hour }}"
    minute: "{{ ircd_tls_sync_cron_minute }}"
    job: "/usr/local/sbin/ircfiber-ircd-tls-sync | grep -q CHANGED && docker kill --signal=HUP {{ ircd_container_name }} || true"
  when: ircd_tls_mode == "letsencrypt"

- name: Run ircfiber-ircd (InspIRCd)
  community.docker.docker_container:
    name: "{{ ircd_container_name }}"
    image: "{{ ircd_image }}"
    state: started
    restart_policy: "{{ ircd_restart_policy }}"
    networks:
      - name: "{{ docker_ircfiber_network }}"
        aliases: "{{ ircd_ircfiber_net_aliases }}"
    networks_cli_compatible: true
    # Dual publish (v4 + v6 explicitly): bare "6667:6667" normalizes to
    # 0.0.0.0-only with no ::: counterpart on this daemon.
    ports:
      - "0.0.0.0:{{ ircd_port_plain }}:{{ ircd_port_plain }}"
      - "[::]:{{ ircd_port_plain }}:{{ ircd_port_plain }}"
      - "0.0.0.0:{{ ircd_port_tls }}:{{ ircd_port_tls }}"
      - "[::]:{{ ircd_port_tls }}:{{ ircd_port_tls }}"
    volumes:
      - "{{ ircd_conf_dir }}:/inspircd/conf"
      - "{{ ircd_data_volume }}:/inspircd/data"
    env:
      # Subject of the self-signed cert the entrypoint generates once.
      INSP_TLS_CN: "{{ ircd_server_name }}"
      INSP_TLS_MAIL: "{{ ircd_admins[0].email }}"
      INSP_TLS_ORG: "{{ ircd_network_name }}"
      INSP_TLS_UNIT: "Server Admins"
      INSP_TLS_DURATION: "3650"
    # Resource limits — see the "Resource limits" block in defaults/main.yml
    # for the measurements, the sendq-based sizing and why the ircd is the
    # most protected process on this host.
    memory: "{{ ircd_memory_limit }}"
    memory_reservation: "{{ ircd_memory_reservation }}"
    cpus: "{{ ircd_cpus | float }}"
    oom_score_adj: "{{ ircd_oom_score_adj | int }}"
    healthcheck:
      # Three layers, in ascending cost:
      #
      #   1. `pgrep inspircd` — the process exists at all.
      #   2. the plain and TLS client ports are in LISTEN state (0A) in
      #      /proc/net/tcp{,6}. This catches a live process that never bound
      #      or has lost its listeners — a bad rehash, a port taken at boot —
      #      which pgrep alone cannot see. Reading /proc opens no connection,
      #      so it is free to run on every invocation.
      #   3. every {{ ircd_healthcheck_socket_every }}th invocation only, a
      #      real TCP connect that exercises accept() end to end.
      #
      # Layer 3 is rate-limited because it is a *client* connection and
      # m_connectban counts every one of those per IP: threshold="32" in
      # modules.conf.j2, and InspIRCd only clears the per-IP counters in its
      # hourly garbage collection. `nc -z` every 30s meant 120 connections
      # per hour from 127.0.0.1, crossing 32 after ~16 minutes: it Z-lined
      # loopback for hours, re-armed on expiry and spammed every oper with
      # ANNOUNCEMENT + XLINE notices (observed 2026-09-06) — while still
      # reporting "healthy", because `nc -z` keeps succeeding against an ircd
      # that is Z-lining the connection. One connect per 10 minutes is 6 per
      # hour: a 5x margin under the threshold in every GC window.
      #
      # The residual risk is structural, not accidental: 127.0.0.1 matches no
      # <connect allow=...> in inspircd.conf.j2, so it falls into the "main"
      # class where connectban and connflood are enabled. Adding a
      # <connect name="localhost" allow="127.0.0.1" ... useconnectban="no"
      # useconnflood="no"> class there is what would make a per-interval
      # socket probe safe; until then the rate limit is the only guard, so
      # do not lower ircd_healthcheck_socket_every.
      #
      # The counter lives in /tmp and every write is guarded: if /tmp is not
      # writable the counter never advances and the probe degrades to layers
      # 1+2 instead of failing the container.
      test:
        - CMD-SHELL
        - >-
          pgrep inspircd >/dev/null 2>&1 || exit 1;
          for p in {{ '%04X' | format(ircd_port_plain | int) }} {{ '%04X' | format(ircd_port_tls | int) }}; do
          grep -qEi "^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-F]+:$p[[:space:]]+[0-9A-F]+:0000[[:space:]]+0A"
          /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1;
          done;
          n={{ ircd_healthcheck_socket_every | int }};
          [ "$n" -le 0 ] && exit 0;
          f=/tmp/.ircd-healthcheck-count;
          c=$(cat "$f" 2>/dev/null || echo 0);
          c=$((c + 1));
          if [ "$c" -ge "$n" ]; then
          (echo 0 > "$f") 2>/dev/null || true;
          nc -z 127.0.0.1 {{ ircd_port_plain }} >/dev/null 2>&1 || exit 1;
          else
          (echo "$c" > "$f") 2>/dev/null || true;
          fi;
          exit 0
      interval: "{{ ircd_healthcheck_interval_seconds }}s"
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      com.ircfiber.component: "ircd"
      com.ircfiber.version: "{{ ircfiber_version }}"
      com.ircfiber.server_name: "{{ ircd_server_name }}"

# Anope database persistence. The anope image declares VOLUME /data/ and
# ships /anope/data/anope.db as a symlink to /data/anope.db. db_flatfile
# saves by writing anope.db.tmp and then rename()-ing it over the target,
# and rename() REPLACES the symlink with a regular file — so from the very
# first save onward every NickServ/ChanServ registration is written to the
# container's writable layer instead of the volume, and is destroyed by the
# next `docker rm`. The volume is therefore mounted at Anope's real data
# dir (/anope/data, see below) instead of the image's /data VOLUME; this
# task first moves whatever state the old layout accumulated inside the
# container onto the volume, so the remount keeps the existing accounts.
#
# Ownership is load-bearing and easy to lose: `docker cp` out of a
# container writes host files as root, so a plain `cp -a` into the volume
# hands Anope a database it cannot read or write ("DB_FLATFILE: Unable to
# open data/anope.db for writing"), and it then runs with an empty
# in-memory database that silently overwrites nothing. The uid/gid are
# therefore read from the live container and re-applied, and the check is
# re-run every deploy so a volume that is already wrong gets repaired.
- name: Migrate Anope database onto the data volume
  ansible.builtin.shell:
    cmd: |
      set -eu
      vol="{{ ircd_services_data_volume }}"
      helper="{{ ircd_cert_sync_image }}"
      container="{{ ircd_services_container_name }}"
      uid={{ ircd_services_uid }}
      gid={{ ircd_services_gid }}
      changed=0

      volume_ok() {
        docker run --rm -v "$vol:/v" "$helper" sh -c "
          test -s /v/anope.db && test ! -L /v/anope.db \
            && test \"\$(stat -c '%u:%g' /v)\" = '$uid:$gid' \
            && test \"\$(stat -c '%u:%g' /v/anope.db)\" = '$uid:$gid'"
      }

      if volume_ok; then
        echo "UNCHANGED"
        exit 0
      fi

      # Everything below mutates the volume, so Anope must not be running.
      # A live services process that could not read the database is holding
      # an EMPTY one in memory, and the instant the files become writable
      # again it commits that emptiness over the real data — which is
      # exactly how #dmz/sq/FiberSupport were lost once already. Stopping
      # first both flushes a healthy process and muzzles a broken one; the
      # next task starts the container again.
      if docker inspect "$container" >/dev/null 2>&1; then
        docker stop "$container" >/dev/null
      fi

      # Salvage state stranded in the container layer by the old /data
      # mount, if the volume has no usable database of its own.
      if ! docker run --rm -v "$vol:/v" "$helper" \
        sh -c 'test -s /v/anope.db && test ! -L /v/anope.db'; then
        if docker inspect "$container" >/dev/null 2>&1; then
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          docker cp "$container:/anope/data/." "$tmp/"
          docker run --rm -v "$vol:/v" -v "$tmp:/src" "$helper" \
            sh -c 'rm -f /v/anope.db; cp -a /src/. /v/'
        fi
        # No container yet: fresh host, Docker populates the empty volume
        # from the image on first start. Nothing to salvage.
      fi

      # `docker cp` writes host files as root, so ownership has to be put
      # back explicitly or Anope cannot read or write its own database.
      docker run --rm -v "$vol:/v" "$helper" sh -c "chown -R $uid:$gid /v"
      changed=1

      [ "$changed" -eq 1 ] && echo "CHANGED" || echo "UNCHANGED"
  register: ircd_anope_db_migrate
  # Exact line: "'CHANGED' in .stdout" would also match "UNCHANGED".
  changed_when: "'CHANGED' in ircd_anope_db_migrate.stdout_lines"

- name: Run ircfiber-services (Anope)
  community.docker.docker_container:
    name: "{{ ircd_services_container_name }}"
    image: "{{ ircd_services_image }}"
    state: started
    restart_policy: "{{ ircd_restart_policy }}"
    networks:
      - name: "{{ docker_ircfiber_network }}"
        aliases:
          - "{{ ircd_services_net_alias }}"
          - "{{ ircd_services_name }}"
    networks_cli_compatible: true
    volumes:
      # Mounted at Anope's real data dir rather than the image's /data
      # VOLUME: the symlink the image uses to bridge the two does not
      # survive db_flatfile's first save (see the migration task above).
      - "{{ ircd_services_data_volume }}:/anope/data"
      - "{{ ircd_services_conf_dir }}/services.conf:/anope/conf/services.conf:ro"
      - "{{ ircd_services_conf_dir }}/nickserv.conf:/anope/conf/nickserv.conf:ro"
      - "{{ ircd_services_conf_dir }}/global.conf:/anope/conf/global.conf:ro"
      - "{{ ircd_services_conf_dir }}/operserv.conf:/anope/conf/operserv.conf:ro"
      - "{{ ircd_services_conf_dir }}/services.motd:/anope/conf/services.motd:ro"
    # Resource limits — see the "Resource limits" block in defaults/main.yml.
    # Services rank just behind the ircd in OOM protection: users stay
    # connected without NickServ, but a restart on an unreadable database
    # has silently destroyed registrations here before.
    memory: "{{ ircd_services_memory_limit }}"
    memory_reservation: "{{ ircd_services_memory_reservation }}"
    cpus: "{{ ircd_services_cpus | float }}"
    oom_score_adj: "{{ ircd_services_oom_score_adj | int }}"
    healthcheck:
      # Process check only, deliberately: Anope has no client listener to
      # probe (its uplink to ircd:{{ ircd_link_port }} is an *outbound*
      # connection, and its absence is normal during a netsplit or an ircd
      # restart, so treating that as unhealthy would flap). The real
      # database/link assertions live in the "Assert Anope loaded its
      # database" task below, which greps the log for "Databases loaded".
      test: ["CMD-SHELL", "pgrep services >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.ircfiber.component: "services"
      com.ircfiber.version: "{{ ircfiber_version }}"
      com.ircfiber.server_name: "{{ ircd_services_name }}"

# Handlers normally fire at the very end of the play — which would restart
# Anope *after* the registrations below and throw them away, because
# db_flatfile only persists on <options:updatetimeout> (5m) or a clean
# shutdown. Flushing here means the restart happens first and the channels
# are registered against the services process that will keep running.
- name: Apply pending ircd/services restarts before touching ChanServ
  ansible.builtin.meta: flush_handlers
  tags: [chanserv]

# Hard stop. If Anope could not read its database it is running on an
# empty one, and the ChanServ registrations below would be flushed over
# the real file — turning a permissions slip into silent data loss. Only
# the log since the current container start is inspected, so an old
# failure that has since been repaired does not block the deploy.
- name: Assert Anope loaded its database
  ansible.builtin.shell:
    cmd: |
      set -eu
      started="$(docker inspect -f '{{ "{{" }}.State.StartedAt{{ "}}" }}' \
        {{ ircd_services_container_name }})"
      log="$(docker logs --since "$started" {{ ircd_services_container_name }} 2>&1)"
      if printf '%s' "$log" | grep -q 'Unable to open .*anope.db'; then
        printf '%s\n' "$log" | grep 'anope.db' | tail -5
        echo "Anope cannot read/write its database — refusing to register" \
          "channels on top of an empty in-memory copy."
        exit 1
      fi
      printf '%s' "$log" | grep -q 'Databases loaded' || {
        echo "Anope has not reported 'Databases loaded' yet."
        exit 1
      }
      echo OK
  register: ircd_anope_db_ok
  until: ircd_anope_db_ok.rc == 0
  retries: 6
  delay: 10
  changed_when: false
  when: ircd_chanserv_setup_enabled | bool
  tags: [chanserv]

# ChanServ ownership of the staff channels: founder, access list, the
# +H chat-history mode lock and topic retention. permchannels alone gives
# none of these, and its modes= attribute cannot change an existing
# network (permchanneldb's saved copy is included first and wins).
- name: Install ChanServ channel setup script
  ansible.builtin.copy:
    src: ircd_channel_setup.py
    dest: /usr/local/sbin/ircfiber-ircd-channel-setup
    owner: root
    group: root
    mode: "0750"
  tags: [chanserv]

# Readiness is the script's job, not a log grep: it WHOISes ChanServ until
# the pseudo-client answers 311. `docker logs --tail 50` only shows the
# "is done syncing" line right after a restart — on a host that has been
# up for days it has long scrolled off, which would have failed every
# `-t chanserv` run.

# Connects over TLS on the published loopback port because the admin oper
# block is sslonly (plaintext /OPER is refused). TLS verification is on
# only in letsencrypt mode: the LE certificate is issued for
# {{ ircd_server_name }} and TLS validates the SNI hostname, not the peer
# address, so a loopback connection with that SNI verifies fine — a
# self-signed cert has no chain to verify against. Passwords are passed in
# `environment:` only, never on the command line.
- name: Register staff channels with ChanServ
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/ircfiber-ircd-channel-setup
  environment:
    IRCD_HOST: "127.0.0.1"
    IRCD_PORT: "{{ ircd_port_tls }}"
    IRCD_TLS: "1"
    IRCD_TLS_VERIFY: "{{ '1' if ircd_tls_mode == 'letsencrypt' else '0' }}"
    IRCD_TLS_SNI: "{{ ircd_server_name }}"
    IRCD_ACCOUNT: "{{ ircd_services_root_account }}"
    IRCD_ACCOUNT_PASSWORD: "{{ vault_ircd_oper_password }}"
    IRCD_ACCOUNT_EMAIL: "{{ ircd_services_root_email }}"
    IRCD_OPER_NAME: "{{ ircd_oper_name }}"
    IRCD_OPER_PASSWORD: "{{ vault_ircd_oper_password }}"
    IRCD_CHANNELS: "{{ ircd_permanent_channels | to_json }}"
    IRCD_TIMEOUT: "{{ ircd_chanserv_setup_timeout }}"
    IRCD_ACCOUNT_DISPLAY: "{{ ircd_services_root_display }}"
    IRCD_CHANNEL_ACCESS: "{{ ircd_channel_access | to_json }}"
    IRCD_CHANNEL_AUTOVOICE: "{{ ircd_channel_autovoice | to_json }}"
    IRCD_SERVICES_BOT: "{{ ircd_services_bot | to_json }}"
  register: ircd_chanserv_setup
  # Exact line: "'CHANGED' in .stdout" would also match "UNCHANGED".
  changed_when: "'CHANGED' in ircd_chanserv_setup.stdout_lines"
  when: ircd_chanserv_setup_enabled | bool
  tags: [chanserv]

# Per-channel results (REGISTERED / mode lock / options / topic).
- name: ChanServ channel setup result
  ansible.builtin.debug:
    var: ircd_chanserv_setup.stdout_lines
  when: ircd_chanserv_setup_enabled | bool
  tags: [chanserv]
