---
# Config changes are applied with a rehash (SIGHUP) so connected
# clients — including every engine-multiplexed platform user — stay up.
# InspIRCd 4 also loads newly added <module> tags on rehash (verified
# 2026-09-04: "REHASH: The m_foo.so module was loaded"); only removing a
# module or changing sslprofile/bind needs `make deploy-restart COMP=ircd`.
- name: Rehash ircd
  ansible.builtin.command:
    argv:
      - docker
      - kill
      - --signal=HUP
      - "{{ ircd_container_name }}"
  changed_when: true

- name: Restart services
  community.docker.docker_container:
    name: "{{ ircd_services_container_name }}"
    state: started
    restart: true
