---
# Config changes are applied with a rehash (SIGHUP) so connected
# clients — including every engine-multiplexed platform user — stay up.
# InspIRCd 4 also loads newly added <module> tags on rehash (verified
# 2026-09-04: "REHASH: The m_foo.so module was loaded"), and ssl_gnutls
# re-reads every <sslprofile> — certificate files included — on rehash
# (ReadConfig -> ReadProfiles, v4.11.0 m_ssl_gnutls.cpp:1201). Only
# removing a module or changing a <bind> needs
# `make deploy-restart COMP=ircd`.
- name: Rehash ircd
  ansible.builtin.command:
    argv:
      - docker
      - kill
      - --signal=HUP
      - "{{ ircd_container_name }}"
  changed_when: true

# TLS-only reload: SIGUSR1 (m_sslrehashsignal) re-reads the certificate
# files without touching the rest of the config. Used when the Let's
# Encrypt cert is renewed, where the bytes change but no config does.
- name: Reload ircd TLS
  ansible.builtin.command:
    argv:
      - docker
      - kill
      - --signal=USR1
      - "{{ ircd_container_name }}"
  changed_when: true

# Same contract as `Rehash ircd`, addressed through kubectl: config lives on
# the node as a hostPath, so the pod already sees the new bytes and only
# needs the signal. Handlers flush after the rollout task, so the pod is
# Ready by the time this runs.
#
# `kill -HUP 1`, not `pkill -x inspircd`: inspircd is the pod's PID 1 and
# busybox pkill never matches it, so the pkill form exited 1 and failed
# every leaf deploy that changed config (2026-09-13).
- name: Rehash k8s ircd
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ ircd_k8s_context }}"
      - --namespace
      - "{{ ircd_k8s_namespace }}"
      - exec
      - deployment/ircfiber-ircd-k8s
      - --
      - kill
      - -HUP
      - "1"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Restart services
  community.docker.docker_container:
    name: "{{ ircd_services_container_name }}"
    state: started
    restart: true

  # The gateway reads inspircd.conf / modules.conf / custom.conf through
  # per-file rw bind mounts (roles/gateway/tasks/container.yml). An Ansible
  # install replaces the host file by rename, orphaning the container-side
  # inode, so the gateway must be RECREATED to see the new bytes (a
  # `docker restart` keeps the stale mount). The ircd reads the conf dir
  # directly and needs only the rehash above. This play owns no gateway
  # containers, so the handler warns instead of recreating: run
  # playbooks/gateway-deploy.yml.
- name: Recreate gateway for ircd conf
  ansible.builtin.debug:
    msg: >-
      inspircd.conf / modules.conf / custom.conf was (re)installed: recreate the gateway
      (ansible-playbook playbooks/gateway-deploy.yml) so its per-file ircd
      conf bind mounts pick up the new inode. Until then the gateway serves
      the pre-install bytes.
