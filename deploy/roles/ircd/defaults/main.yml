---
# IRC Fiber — IRC daemon (InspIRCd 4 + Anope 2 services) defaults
#
# Images, container names, ports and volumes live in
# inventories/production/group_vars/all/vars.yml.

# Container restart
ircd_restart_policy: "unless-stopped"

# ---------------------------------------------------------------------------
# Resource limits
#
# Nothing on this host had a memory or CPU limit before 2026-09-06 (docker
# inspect showed Memory 0, NanoCpus 0, CpuShares 0 for every container), so
# one runaway process took all 7.565 GiB of RAM, dockerd stopped answering
# and the site went down with it. These caps turn that into a single
# container being OOM-killed and restarted by `unless-stopped`.
#
# oom_score_adj deliberately orders the victims (whole stack, most-protected
# first):
#   ircd (-500) < services (-300) < gateway (+200) < bnc (+300)
#     < support-bot (+500)
# The ircd is the most damaging process to lose: killing it disconnects every
# user on the network simultaneously and the reconnect storm that follows
# then hits the same starved host. Services rank just behind it — users stay
# connected without them, but NickServ/ChanServ state is in play and a
# restart on an unreadable database has cost us data before. The gateway
# replicas, bnc and the support bot are stateless and health-checked, so they
# are made the preferred victims instead.
#
# Reservations are only soft floors under host pressure and are kept far
# below the limits on purpose: 128 + 64 MiB for this role.

# Measured steady state: 8.5 MiB RSS — but that is an idle-ish figure and the
# ircd is the one process here whose footprint scales with users: the "main"
# connect class allows hardsendq="1M" per client up to
# {{ ircd_public_class_limit }} clients, so 4-8x of the idle measurement
# (35-70 MiB) would be OOM-killed by an ordinary evening. 512 MiB is sized
# for the sendq headroom, not for the idle baseline, and is still only 6.6%
# of host RAM.
ircd_memory_limit: "512m"
ircd_memory_reservation: "128m"
# InspIRCd is effectively single-threaded; 2 of 4 vCPUs leaves it room for
# TLS handshake bursts while making it impossible to monopolise the host.
ircd_cpus: 2.0
ircd_oom_score_adj: -500

# Measured steady state: 6.0 MiB RSS. Anope keeps its whole database in
# memory (prod anope.db is ~450 KB today), so growth is slow and bounded;
# 256 MiB is a wide margin over any plausible registration count.
ircd_services_memory_limit: "256m"
ircd_services_memory_reservation: "64m"
ircd_services_cpus: 1.0
ircd_services_oom_score_adj: -300

# ---------------------------------------------------------------------------
# Health probes (see the healthcheck comments in tasks/main.yml)
#
# The socket probe runs on every Nth healthcheck invocation, i.e. every
# {{ (ircd_healthcheck_interval_seconds | int) * (ircd_healthcheck_socket_every | int) }}
# seconds. It has to stay rare because m_connectban counts *every* inbound
# connection per IP (threshold="32" in modules.conf.j2) and InspIRCd only
# clears those counters in its hourly garbage collection: a probe every 30 s
# is 120 connections/hour from 127.0.0.1, which Z-lined loopback for hours on
# 2026-09-06. At 20 (one connect per 10 minutes) it is 6 connections/hour —
# a 5x margin under the threshold. Set to 0 to disable the connect probe
# entirely and rely on the process + listener checks alone.
ircd_healthcheck_interval_seconds: 30
ircd_healthcheck_socket_every: 20

# Host-side config dirs. The InspIRCd dir is bind-mounted over
# /inspircd/conf/ and must be writable by uid 10000 (the image entrypoint
# writes cert.pem/key.pem/dhparams.pem there on first boot). The Anope dir
# holds the rendered config files that are bind-mounted individually into
# /anope/conf/ (the image ships the *.example.conf includes there).
ircd_conf_dir: "/etc/ircfiber/ircd"
ircd_services_conf_dir: "/etc/ircfiber/services"
ircd_container_uid: 10000

# Docker network aliases. The engine dials irc.ircfiber.com; on the host
# it must resolve to the container (not the public hairpin), so the
# server name is an alias on ircfiber_net. Anope dials the `ircd` alias.
ircd_ircfiber_net_alias: "ircd"
ircd_ircfiber_net_aliases:
  - "{{ ircd_ircfiber_net_alias }}"
  - "{{ ircd_server_name }}"
ircd_services_net_alias: "services"

# Server identity
ircd_server_name: "irc.ircfiber.com"
ircd_server_description: "IRC Fiber"
ircd_server_id: "1FB"
ircd_net_suffix: ".ircfiber.com"
ircd_network_name: "IRC Fiber"
ircd_admins:
  - name: "IRC Fiber Admin"
    email: "admin@ircfiber.com"

# Services pseudo-server (Anope). Must not collide with any real server.
ircd_services_name: "services.ircfiber.com"
ircd_services_description: "IRC Fiber Services"
# Server-to-server port InspIRCd listens on for the Anope link. Never
# published to the host; reachable only on the Docker network.
ircd_link_port: 7000

# Trusted subnet: IRC Fiber engine containers multiplex every platform
# user through a handful of IPs here, so it gets no clone limits, no DNS
# lookups and no throttling.
ircd_trusted_subnet: "{{ docker_ircfiber_subnet }}"
# Same, IPv6 half (dual-stack ircfiber_net). Used by the engine connect
# class and the Dashboard oper host mask.
ircd_trusted_subnet_v6: "{{ docker_ircfiber_subnet_v6 }}"
ircd_engine_class_limit: 20000

# Registration / auth
ircd_allow_registration: true
ircd_require_sasl: false

# Limits
ircd_max_channels_per_account: 100
ircd_ip_limits_connections: 5
ircd_public_class_limit: 5000
ircd_nicklen: 32
ircd_identlen: 20
ircd_channellen: 64
ircd_awaylen: 390
ircd_kicklen: 390
ircd_topiclen: 390
ircd_softlimit: 20000

# Oper (IRCd oper + Anope "Services Root"). Password from vault.
ircd_oper_name: "admin"
ircd_oper_vhost: "staff"
ircd_oper_sslonly: true

# Extra NickServ accounts granted Anope "Services Root" beyond
# {{ ircd_oper_name }}. Each entry still needs to /OPER on the IRCd first
# (require_oper = yes in services.conf.j2), so listing an account here
# grants nothing on its own — the NickServ account name and the <oper>
# name in opers.conf are independent.
ircd_services_root_extra_accounts:
  - "sq"

# uid:gid the anope/anope image runs its services process as. The gid is
# `nogroup`, deliberately unrelated to the uid, so it cannot be derived —
# and it is load-bearing: the data volume must be owned by exactly this
# pair or Anope logs "DB_FLATFILE: Unable to open data/anope.db for
# reading" and runs on an empty in-memory database.
ircd_services_uid: 10000
ircd_services_gid: 65533

# Dashboard oper for the admin web UI (Dashboard class: REHASH + STATS +
# G/K/Z-LINE only, host-locked to the Docker network). Gateway reads the
# password from vault_ircd_dashboard_password via IRCFIBER_IRCD_OPER_PASSWORD.
ircd_dashboard_oper_name: "dashboard"

# Host cloaking. Must match linked servers exactly (method + key +
# prefix + suffix) or spanningtree CAPAB refuses the link. Aligned with
# irc.netcrave.chat: no prefix, "hidden" suffix. Empty prefix omits the
# attribute (see modules.conf.j2). Changing any of these re-cloaks users.
ircd_cloak_prefix: ""
ircd_cloak_suffix: "hidden"

# Channels every user auto-joins on connect (conn_join). Empty = none.
ircd_default_channels: []

# Tor onion ingress (Paige's pattern from irc.netcrave.chat) — ircd half
# only. The Tor daemon + HAProxy half is NOT deployed yet; when enabled,
# a PROXY-protocol proxy must feed the listener or nothing will match the
# tor class. OFF by default. Link-neutral: haproxy is VF_VENDOR + modeless.
ircd_tor_enabled: false
# Unpublished container-side port for the haproxy listener. Do NOT add to
# tasks/main.yml ports: haproxy listeners must never be public (PROXY
# headers are unauthenticated, so a public listener allows origin spoofing).
ircd_tor_port: 8080
# Bind address inside the container ("" = all interfaces, container-scoped).
ircd_tor_listen_address: ""
# Per-circuit ULA range assigned by the proxy helper. Ours is distinct from
# netcrave's fc00:dead:beef:4dad::/64 ("tor" in hex). Uncloaked by design so
# hostmasks read *!*@tor/<circuit> and +b *!*@tor/* works per-circuit.
ircd_tor_ula_range: "fd00:746f:72::/64"
# Optional corralling channel for tor arrivals (their side uses #tor).
ircd_tor_autojoin: ""
#  - "#ircfiber"
#  - "#welcome"

# Channels created at boot and kept open when empty (+P). These are the
# engine's DEFAULT_FIBER_CHANNELS, so the auto-join never 403s. They are
# also registered with ChanServ (founder = {{ ircd_services_root_account }},
# the services-root account) so they keep a founder, an access list, a
# re-asserted mode lock and topic retention; `description` is the one-line
# text ChanServ REGISTER stores. `history` switches on chat-history replay
# (`+H <lines>:<age>`, InspIRCd's chanhistory module) and must stay within
# the <chanhistory maxlines/maxduration> caps in modules.conf.j2.
ircd_permanent_channels:
  - channel: "#ircfiber"
    modes: "nt"
    history: "50:1w"
    description: "IRC Fiber"
    topic: "Welcome to IRC Fiber — https://ircfiber.com"
  - channel: "#welcome"
    modes: "nt"
    history: "50:1w"
    description: "IRC Fiber newcomers"
    topic: "New here? Say hi. /msg NickServ HELP to register your nick."
  - channel: "#support"
    modes: "nt"
    history: "50:1w"
    description: "IRC Fiber support requests"
    topic: "IRC Fiber support — report problems at https://ircfiber.com/?/feedback · FiberSupport announces new reports here"

# ChanServ registration of the staff channels above (roles/ircd/files/
# ircd_channel_setup.py, run over TLS on the loopback TLS port). Set false
# to skip it entirely, e.g. on a host where services are not deployed.
ircd_chanserv_setup_enabled: true
# NickServ account that owns the staff channels. services.conf.j2 already
# declares oper { name = "{{ ircd_oper_name }}"; type = "Services Root";
# require_oper = yes }, so this account is the designated Services Root and
# its password is vault_ircd_oper_password — but an oper block only becomes
# usable once the account it names actually exists in NickServ, which is
# exactly what the setup script registers on its first run.
ircd_services_root_account: "{{ ircd_oper_name }}"
# Used only when the account still has to be registered. Anope runs with
# usemail = no, so no confirmation mail is ever sent to it.
ircd_services_root_email: "{{ ircd_admins[0].email }}"
# Overall seconds budget for the whole setup run (IRCD_TIMEOUT). Has to
# cover the script's 120 s wait for services to link plus NickServ's 30 s
# regdelay on the very first run, before any channel work starts.
ircd_chanserv_setup_timeout: 420

# Server fingerprinting: VERSION replies show this instead of "InspIRCd-4",
# and netsplit quits are hidden. Cosmetic; no protocol impact.
ircd_custom_version: "IRC Fiber"
ircd_hide_splits: true

# DNSBL connection checks (DroneBL + EFnet RBL + Tor exits). Off by
# default: lookups add connect latency and can false-positive on shared
# or CGNAT ranges. The engine class is always exempt (usednsbl=no);
# setting this true flips only the public "main" class to usednsbl=yes.
ircd_enable_dnsbl: false

# Logging (InspIRCd log level: error | warning | normal | debug)
ircd_log_level: "normal"

# Anope: registered nicks expire after this long without identifying.
ircd_services_nick_expire: "90d"

# Public TLS mode: "selfsigned" (image entrypoint generates cert.pem/key.pem,
# current behavior) or "letsencrypt" (use the Caddy-issued LE cert for
# {{ ircd_server_name }}, synced from the Caddy data volume into the conf
# dir by the role; see tasks/main.yml). Opt in per host with
# ircd_tls_mode: "letsencrypt" in host_vars once Caddy serves the irc
# hostname via caddy_acme_hosts and port 80 is reachable for HTTP-01.
ircd_tls_mode: "selfsigned"
# Filenames inside {{ ircd_conf_dir }} for the synced LE cert/key.
# (Relative names resolve against the InspIRCd conf dir, same as the
# default cert.pem/key.pem.)
ircd_tls_cert_file: "tls-cert.pem"
ircd_tls_key_file: "tls-key.pem"
# Source paths inside the Caddy data volume (same storage layout the
# bnc_tls_cert_path pattern in group vars relies on).
ircd_le_cert_src: "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ ircd_server_name }}/{{ ircd_server_name }}.crt"
ircd_le_key_src: "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ ircd_server_name }}/{{ ircd_server_name }}.key"
# Helper image for the one-shot sync container (both volumes mounted).
ircd_cert_sync_image: "alpine:3.21"
# Daily renewal check (cron on the host, runs as root).
ircd_tls_sync_cron_hour: "3"
ircd_tls_sync_cron_minute: "17"
