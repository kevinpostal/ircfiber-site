---
- name: Preflight — verify OS
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian']
      - (ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22.04', '24.04', '26.04']) or
        (ansible_distribution == 'Debian' and ansible_distribution_major_version in ['11', '12'])
    fail_msg: "IRC Fiber playbooks require Ubuntu 22.04/24.04/26.04 or Debian 11/12. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages (optional, off by default)
  ansible.builtin.apt:
    upgrade: dist
  when: common_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_apt_packages }}"
    state: present

- name: Install optional convenience packages
  ansible.builtin.apt:
    name: "{{ common_apt_packages_optional }}"
    state: present

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# --- Swap -------------------------------------------------------------------
# The OVH box ships swapless. On 2026-09-13 a memory spike (mongod sizing its
# WiredTiger cache off total RAM) had no relief valve: the kernel thrashed
# instead of paging, load hit 57 on 4 cores, sshd and Caddy stopped answering
# within the request timeout, Cloudflare served 502s, and the gateway was
# OOM-killed twice. Swap does not fix a leak — it buys the minutes needed to
# log in and fix one.
- name: Create swap file
  ansible.builtin.command: "fallocate -l {{ common_swap_size }} {{ common_swap_file }}"
  args:
    creates: "{{ common_swap_file }}"
  when: common_swap_enabled | bool
  register: common_swap_created

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: "{{ common_swap_file }}"
    owner: root
    group: root
    mode: "0600"
  when: common_swap_enabled | bool

- name: Format swap file
  ansible.builtin.command: "mkswap {{ common_swap_file }}"
  when:
    - common_swap_enabled | bool
    - common_swap_created is changed

- name: Persist swap file in /etc/fstab
  ansible.posix.mount:
    path: none
    src: "{{ common_swap_file }}"
    fstype: swap
    opts: sw
    state: present
  when: common_swap_enabled | bool

- name: Read active swap devices
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: common_swap_active
  changed_when: false
  when: common_swap_enabled | bool

# `swapon` on an already-active file exits 255 ("Device or resource busy"),
# so the guard is the device list, not the exit code.
- name: Activate swap file
  ansible.builtin.command: "swapon {{ common_swap_file }}"
  when:
    - common_swap_enabled | bool
    - common_swap_file not in (common_swap_active.stdout_lines | default([]) | map('trim') | list)

# Low swappiness: swap is an emergency buffer here, not a working-set store.
- name: Tune vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ common_swappiness }}"
    sysctl_file: /etc/sysctl.d/60-ircfiber-swap.conf
    state: present
    reload: true
  when: common_swap_enabled | bool

- name: Ensure /etc/ircfiber exists
  ansible.builtin.file:
    path: /etc/ircfiber
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create /var/backups/ircfiber
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
