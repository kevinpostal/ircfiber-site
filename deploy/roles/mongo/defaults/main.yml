---
mongo_container_name: ircfiber-mongo
mongo_bind_ip: "{{ host_tailscale_ip | default('0.0.0.0') }}"
mongo_healthcheck_interval: 10s
mongo_healthcheck_timeout: 5s
mongo_healthcheck_retries: 5
mongo_healthcheck_start_period: 20s
mongo_no_new_privileges: true
mongo_ulimits:
  nofile:
    soft: 64000
    hard: 64000
# Memory. The box is 8 GB shared with the engine, gateway, redis and ircd,
# so mongod must not size itself off total RAM: WiredTiger's default cache
# is 50% of (RAM - 1 GB) ≈ 3.4 GB here, which is what drove the host into
# swapless OOM/thrash on 2026-09-13 (load 57, sshd unresponsive, gateway
# OOM-killed twice). Cache is capped below and the container gets a hard
# ceiling ~2x the cache so a runaway is killed instead of taking the host.
mongo_wiredtiger_cache_gb: "0.5"
mongo_memory_limit: "1500m"
# Ceiling only; mongod is never the priority on this box.
mongo_cpus: 1.5
