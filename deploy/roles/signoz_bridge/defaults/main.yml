---
# SigNoz bridge collector
signoz_bridge_container: "ircfiber-otel-collector"
signoz_bridge_image: "otel/opentelemetry-collector-contrib:0.119.0"
signoz_bridge_mem: 256m
signoz_bridge_cpus: 0.5
# Networks to attach the bridge to:
#   - ircfiber_net: where ircfiber D services live (gateway, engine, holder, caddy)
#   - ircfiber_logging: kept for the retired local signoz-ingester alias
signoz_bridge_networks:
  - ircfiber_net
  - ircfiber_logging
# OTLP ingest ports exposed to the ircfiber_net
signoz_bridge_otlp_grpc_port: 4317
signoz_bridge_otlp_http_port: 4318
# Health check endpoint (extensions/health_check)
signoz_bridge_health_port: 13133
# Collector self-telemetry (Prometheus scrape endpoint on the container IP).
signoz_bridge_telemetry_port: 8888

# Export target. SigNoz no longer runs on this host — it lives on the k3s box
# and is reached over the tailnet. Until this was pointed there, prod shipped
# NO host metrics at all, which is why the 2026-09-13 memory exhaustion was
# invisible until the site 502'd: every host-scoped rule in
# roles/logging/files/alerts only ever saw the k3s node.
#
# Port 4320 is the collector's dedicated `otlp/ovh` gRPC receiver. It skips
# k8sattributes/resourcedetection and stamps host.name=ovh-prod — the
# identity those rules filter on, and the same pipeline fluent-bit already
# uses for container logs (4319, http). The generic 4317 receiver would land
# these metrics under k8s identities that no rule matches.
signoz_bridge_export_endpoint: "otel-collector.tail544547.ts.net:4320"

# The identity this host publishes on every signal. Must match the host.name
# the alert rules in roles/logging/files/alerts filter on.
signoz_bridge_host_name: "ovh-prod"
