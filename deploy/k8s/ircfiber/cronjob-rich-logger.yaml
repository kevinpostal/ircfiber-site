# Rich demo logger — runs once per hour, not every 15s, with trace correlation
# This replaces the spammy Deployment that sent a log every 15s.
# It sends a single rich log+trace pair correlated via traceId/spanId.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ircfiber-rich-demo
  namespace: ircfiber
spec:
  schedule: "0 * * * *"  # hourly
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rich
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  TRACEID=5e4d1c3a2b1a4f5c6d7e8f9a0b1c2d3e
                  SPANID=a1b2c3d4e5f60708
                  CHILD=b2c3d4e5f6a70809
                  TS=$(date +%s); TSNANO="${TS}000000000"; TSNANO2="$((TS+1))000000000"
                  echo "rich demo: trace $TRACEID span $SPANID"
                  # rich log with trace correlation
                  cat > /tmp/rich.json <<EOF
                  {"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ircfiber-gateway"}},{"key":"k8s.namespace.name","value":{"stringValue":"ircfiber"}}]},"scopeLogs":[{"scope":{"name":"ircfiber.api"},"logRecords":[{"timeUnixNano":"$TSNANO","severityNumber":9,"severityText":"INFO","body":{"stringValue":"POST /api/channels/superbowl/join user=zodiac latency=42ms"},"attributes":[{"key":"http.method","value":{"stringValue":"POST"}},{"key":"http.route","value":{"stringValue":"/api/channels/:channel/join"}},{"key":"user.id","value":{"stringValue":"zodiac"}}],"traceId":"$TRACEID","spanId":"$SPANID"}]}]}]}
                  EOF
                  wget -qO- --header="Content-Type: application/json" --post-file=/tmp/rich.json http://signoz-otel-collector.signoz.svc.cluster.local:4318/v1/logs || echo "log failed"
                  # rich trace with parent/child
                  cat > /tmp/trace.json <<EOF
                  {"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ircfiber-gateway"}}]},"scopeSpans":[{"scope":{},"spans":[{"traceId":"$TRACEID","spanId":"$SPANID","name":"POST /api/channels/:channel/join","kind":1,"startTimeUnixNano":"$TSNANO","endTimeUnixNano":"$TSNANO2","attributes":[{"key":"http.route","value":{"stringValue":"/api/channels/:channel/join"}}],"status":{"code":1}},{"traceId":"$TRACEID","spanId":"$CHILD","parentSpanId":"$SPANID","name":"db.query","kind":3,"startTimeUnixNano":"$TSNANO","endTimeUnixNano":"$TSNANO","attributes":[{"key":"db.system","value":{"stringValue":"mongodb"}}],"status":{"code":1}}]}]}]}
                  EOF
                  wget -qO- --header="Content-Type: application/json" --post-file=/tmp/trace.json http://signoz-otel-collector.signoz.svc.cluster.local:4318/v1/traces || echo "trace failed"
