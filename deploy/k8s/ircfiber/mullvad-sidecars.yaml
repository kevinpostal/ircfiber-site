# Mullvad SOCKS sidecars for k8s (k8s-only, OVH sidecars mirror prod 6-pool)
# Each pod runs tailscale/tailscale:stable in userspace (TS_USERSPACE=true)
# — no TUN, no NET_ADMIN, no hostPath — avoids DinD cni0 wedge.
# Engine reaches them via Kubernetes DNS: tailscale-mullvad-<name>:1055
# Pool env on engine/gateway: socks5://tailscale-mullvad-de:1055,...,us:1055 (6)
# Secrets: tailscale-authkey (TS_AUTHKEY) — reusable authkey with tag:ircfiber (non-ephemeral, 90d)
# Deploy: kubectl apply -f mullvad-sidecars.yaml
# Verify: kubectl get pods -n ircfiber -l component=mullvad-sidecar; kubectl logs -n ircfiber -l app=tailscale-mullvad-de
# --- tailscale-authkey Secret ---
# DO NOT commit the real TS_AUTHKEY — create it out-of-band:
#   kubectl create secret generic tailscale-authkey -n ircfiber \
#     --from-literal=TS_AUTHKEY='tskey-auth-...' --dry-run=client -o yaml | kubectl apply -f -
# Or via Ansible vault: vault_tailscale_authkey in deploy/inventories/production/group_vars/vault.yml
# The Secret manifest below is intentionally omitted from git; keep only the reference
# via secretKeyRef in the Deployments that follow.
# --- de (de-ber-wg-003) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-mullvad-de
  namespace: ircfiber
  labels:
    app: tailscale-mullvad-de
    component: mullvad-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-mullvad-de
  template:
    metadata:
      labels:
        app: tailscale-mullvad-de
        component: mullvad-sidecar
    spec:
      containers:
        - name: tailscale
          image: tailscale/tailscale:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-authkey
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: k8s-mullvad-de
            - name: TS_EXTRA_ARGS
              value: --exit-node=100.117.47.8 --exit-node-allow-lan-access --accept-dns=false --accept-routes
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SOCKS5_SERVER
              value: ":1055"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
          ports:
            - containerPort: 1055
              name: socks
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tailscale-mullvad-de
  namespace: ircfiber
  labels:
    app: tailscale-mullvad-de
spec:
  selector:
    app: tailscale-mullvad-de
  ports:
    - name: socks
      port: 1055
      targetPort: 1055
      protocol: TCP
---
