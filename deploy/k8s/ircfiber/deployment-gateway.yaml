# Real ircfiber gateway (D vibe.d) — template for k3s
# Build image first: DOCKER_BUILDKIT=1 docker build -f Containerfile.site --target runtime-gateway -t localhost:5000/ircfiber-gateway:dev . && docker push localhost:5000/ircfiber-gateway:dev
# Then apply: kubectl --context ubuntu-docker apply -f deployment-gateway.yaml
# Requires redis + mongo (see redis-mongo-dev.yaml) — deploy those first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ircfiber-gateway
  namespace: ircfiber
  labels:
    app: ircfiber-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ircfiber-gateway
  template:
    metadata:
      labels:
        app: ircfiber-gateway
    spec:
      containers:
        - name: gateway
          image: localhost:5000/ircfiber-gateway:dev
          imagePullPolicy: Always
          command: ["/usr/bin/tini", "--", "/app/irc-fiber"]
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PORT
              value: "8090"
            - name: IRCFIBER_REDIS_URL
              value: "redis://redis.ircfiber.svc.cluster.local:6379"
            - name: IRCFIBER_MONGO_URL
              value: "mongodb://mongo.ircfiber.svc.cluster.local:27017/ircfiber"
            - name: IRCFIBER_OTEL_ENABLED
              value: "1"
            - name: IRCFIBER_OTEL_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
            - name: IRCFIBER_MULLVAD_POOL
              value: "socks5://tailscale-mullvad-de:1055,socks5://tailscale-mullvad-ch:1055,socks5://tailscale-mullvad-nl:1055,socks5://tailscale-mullvad-se:1055,socks5://tailscale-mullvad-gb:1055,socks5://tailscale-mullvad-us:1055"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ircfiber-gateway
  namespace: ircfiber
spec:
  selector:
    app: ircfiber-gateway
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ircfiber-gateway
  namespace: ircfiber
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ircfiber.ubuntu-docker.tail544547.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ircfiber-gateway
                port:
                  number: 8090
    - host: ircfiber-dev.tail544547.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ircfiber-gateway
                port:
                  number: 8090
