---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-keyfile
  namespace: ircfiber
type: Opaque
data:
  keyfile: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: ircfiber
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
    systemLog:
      destination: file
      path: /var/log/mongodb/mongod.log
      logAppend: true
    net:
      port: 27017
      bindIp: 0.0.0.0
      bindIpAll: false
    processManagement:
      fork: false
      timeZoneInfo: /usr/share/zoneinfo
    security:
      authorization: enabled
      keyFile: /etc/mongo-keyfile/keyfile
    replication:
      replSetName: rs0
      oplogSizeMB: 1024
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: ircfiber
  labels:
    app: mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - port: 27017
      name: mongo
      protocol: TCP
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: ircfiber
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: mongo
          image: mongo:7
          command:
            - mongod
            - --config
            - /etc/mongod/mongod.conf
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /etc/mongod/mongod.conf
              subPath: mongod.conf
            - name: mongo-keyfile
              mountPath: /etc/mongo-keyfile
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand({ping:1}).ok
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand({ping:1}).ok
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: mongo-config
          configMap:
            name: mongo-config
        - name: mongo-keyfile
          secret:
            secretName: mongo-keyfile
            defaultMode: 0o600
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
