# Least-privilege access for the gateway's admin Backups page
# (`GET /api/admin/backups`, Run now, Suspend/Resume, pod-log tail) and the
# admin K8s-leaf page (scale `deployment/ircfiber-ircd-k8s` 0↔1, read the
# node's Ready/pressure conditions for the preflight checks).
#
# There is deliberately NO `delete` verb anywhere: the pages can list
# CronJobs/jobs/pods, read pod logs, create a manual Job from the CronJob
# template, flip `spec.suspend` and patch the leaf Deployment's replica count
# — they can never remove a job, an archive or a Deployment. Archive deletion
# stays with the jobs' own 14-day `find -mtime +14` prune; restores stay with
# `site/deploy/playbooks/restore.yml`.
#
# The Role is namespaced to `ircfiber-prod`, so this token cannot touch the
# `ircfiber` dev namespace or any other namespace. The one cluster-scoped
# grant is the node *reader* ClusterRole at the bottom of this file: node
# conditions are cluster-scoped objects, so a Role cannot express them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ircfiber-backup-admin
  namespace: ircfiber-prod
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ircfiber-backup-admin
  namespace: ircfiber-prod
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: backup
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ircfiber-backup-admin
  namespace: ircfiber-prod
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: backup
subjects:
  - kind: ServiceAccount
    name: ircfiber-backup-admin
    namespace: ircfiber-prod
roleRef:
  kind: Role
  name: ircfiber-backup-admin
  apiGroup: rbac.authorization.k8s.io
---
# Non-expiring token for the gateway (k3s still honors the legacy
# `kubernetes.io/service-account-token` controller). If the token field stays
# empty after ~15 s, mint a time-boxed token instead:
#   kubectl -n ircfiber-prod create token ircfiber-backup-admin --duration=8760h
# and record the expiry date in the vault comment next to the value.
apiVersion: v1
kind: Secret
metadata:
  name: ircfiber-backup-admin-token
  namespace: ircfiber-prod
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: backup
  annotations:
    kubernetes.io/service-account.name: ircfiber-backup-admin
type: kubernetes.io/service-account-token
---
# Cluster-scoped, read-only: the admin K8s-leaf preflight refuses to start the
# leaf when the node is NotReady or under Disk/Memory/PID pressure (the
# DiskPressure eviction loop is what made the hub's old <autoconnect> storm
# every peer with REMOTELINK snotices).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ircfiber-gateway-node-reader
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: gateway
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ircfiber-gateway-node-reader
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: gateway
subjects:
  - kind: ServiceAccount
    name: ircfiber-backup-admin
    namespace: ircfiber-prod
roleRef:
  kind: ClusterRole
  name: ircfiber-gateway-node-reader
  apiGroup: rbac.authorization.k8s.io
