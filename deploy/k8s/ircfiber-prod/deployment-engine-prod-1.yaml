# IRC Fiber engine — k8s PROD (distributed with OVH ovh)
# Shares OVH prod DB via Tailscale (100.94.72.103) so OVH gateway sees this engine.
# Mullvad pool via k8s sidecars in ircfiber namespace (tailscale-mullvad-* Services, FQDN).
# IRC sockets live in ircfiber-holder-prod-1 (deployment-holder-prod-1.yaml, apply
# it first): a rollout of this Deployment is a hot swap — the old pod detaches on
# SIGTERM, the new one reattaches, no IRC reconnect.
# Build image: DOCKER_BUILDKIT=1 docker build -f ../engine/Containerfile.engine -t localhost:5000/ircfiber-engine:dev --target runtime-engine .. && docker push localhost:5000/ircfiber-engine:dev
# Apply: kubectl --context ubuntu-docker apply -f deployment-engine-prod-1.yaml
# Verify: kubectl --context ubuntu-docker get pods -n ircfiber-prod -o wide; kubectl logs -n ircfiber-prod -l app=ircfiber-engine-prod-1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ircfiber-engine-prod-1
  namespace: ircfiber-prod
  labels:
    app: ircfiber-engine-prod-1
    component: engine-prod
spec:
  replicas: 1
  # Stop-then-start, like docker: a rolling update would run two engines
  # against one holder (ATTACH → ERR busy storm).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ircfiber-engine-prod-1
  template:
    metadata:
      labels:
        app: ircfiber-engine-prod-1
        component: engine-prod
    spec:
      # SIGTERM = hot-swap detach (10 s budget) before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: localhost:5000/ircfiber-engine:dev
          imagePullPolicy: Always
          command: ["/app/irc-fiber-engine"]
          ports:
            - containerPort: 8091
              name: admin
          env:
            - name: IRCFIBER_REDIS_URL
              value: "redis://100.94.72.103:6379/0"
            - name: IRCFIBER_MONGO_URL
              value: "mongodb://ircfiber:jqgwEv3GJwwizulaj3Fnbd8imqcMH4Gh@mongo.ircfiber.svc.cluster.local:27017/ircfiber"
            - name: IRCFIBER_OTEL_ENABLED
              value: "1"
            - name: IRCFIBER_OTEL_ENDPOINT
              value: "http://100.94.116.56:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.cluster.name=ubuntu-docker,service.name=ircfiber-engine,deployment.environment=prod"
            - name: IRCFIBER_LOG_LEVEL
              value: "info"
            - name: IRCFIBER_SERVER_ID
              value: "k8s-prod-1"
            - name: IRCFIBER_BIND_ADDRESS
              value: "0.0.0.0"
            - name: IRCFIBER_HOLDER_ADDR
              value: "tcp://ircfiber-holder-prod-1.ircfiber-prod.svc.cluster.local:7690"
            - name: IRCFIBER_HOLDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ircfiber-holder-prod-1
                  key: token
            - name: IRCFIBER_MULLVAD_POOL
              # Explicit <label>@ prefixes are required for bare-IP entries: the
              # dash/dot label heuristic would collapse all three to "100" and
              # the slot registry would see a single slot.
              value: "socks5://de@100.94.116.56:1080,socks5://ch@100.94.116.56:1081,socks5://us@100.94.116.56:1082"
            # IRCFIBER_IRCD_WEBIRC_PASSWORD is deliberately absent: this pod
            # dials the OVH ircd from outside the docker subnets the
            # <gateway type="webirc"> mask admits, so a WEBIRC from here
            # would be refused (snotice per connect) and the session would
            # keep this pod's address anyway. To enable it, widen the mask
            # and add the vault value as a Secret-backed env var.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["/usr/local/bin/ircfiber-engine-healthcheck.sh"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/ircfiber-engine-healthcheck.sh"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ircfiber-engine-prod-1
  namespace: ircfiber-prod
  labels:
    app: ircfiber-engine-prod-1
spec:
  selector:
    app: ircfiber-engine-prod-1
  ports:
    - name: admin
      port: 8091
      targetPort: 8091
