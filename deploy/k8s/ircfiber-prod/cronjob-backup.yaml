# Daily off-host backups of IRC Fiber prod state, run on ubuntu-docker k3s.
#
# Why this exists: on 2026-09-06 an account purge removed a user's networks and
# the only copy on the OVH host was a hand-made tarball from 2026-08-23 whose
# embedded mongodump archive had never been test-restored. It turned out to be
# gzip-wrapped, so `mongorestore --archive` answered "stream or file does not
# appear to be a mongodump archive" and recovered nothing. Both rules below
# follow from that: keep dailies off the box that holds the data, and make each
# job prove its own archive restores before it reports success.
# Publish contract (read by the admin Backups page, GET /api/admin/backups):
# each job captures its own exit code, then publishes exactly one record —
# the mongo job via mongosh into the `backup_runs` collection (mongo:7 has no
# redis-cli), the redis job via redis-cli LPUSH to `irc:backup:runs` (capped
# at 60). The record carries status/stage/duration/archive size plus a full
# inventory of /backups and its df volume usage, so the page needs no node
# access. Publish failures never change the job's verdict; the pod log
# (cat'ed at the end) keeps the full detail for the page's log tail.
#
# Why the `ircfiber-prod` namespace rather than a dedicated one:
#   * Rancher is broken on this cluster (rancher, rancher-webhook and
#     api-extension pods Pending/Error), and its `rancher.cattle.io` validating
#     webhook fails closed — `kubectl create namespace` is refused outright.
#   * This namespace already carries `allow-ovh-prod-db-and-mullvad`, whose
#     egress rule permits TCP 6379 and 27017 to any address, which is exactly
#     the OVH-over-tailnet access a backup needs. The `ircfiber` namespace does
#     NOT: its `allow-egress-to-signoz` policy selects every pod and opens only
#     80/443/41641/1055/6697/6667 to 0.0.0.0/0, so a backup pod there cannot
#     reach the databases at all.
#
# Credentials live in the `ircfiber-backup-conn` Secret, created imperatively
# and deliberately NOT committed:
#
#   ssh -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519_ircfiber deploy@100.94.72.103 \
#     'docker exec ircfiber-gateway cat /etc/ircfiber/gateway/secrets/mongo_url' \
#     | tr -d '\n' > /tmp/MONGO_URL          # then rewrite the host to 100.94.72.103:27017
#   printf 'redis://100.94.72.103:6379/0' > /tmp/REDIS_URL
#   kubectl -n ircfiber-prod create secret generic ircfiber-backup-conn \
#     --from-file=MONGO_URL=/tmp/MONGO_URL --from-file=REDIS_URL=/tmp/REDIS_URL
#
# Declarative apply path (RBAC for the admin Backups page ships alongside):
#   make -f Makefile.k8s k8s-prod-backups-apply
# Run one now:      kubectl -n ircfiber-prod create job --from=cronjob/ircfiber-mongo-backup manual-$(date +%s)
# List archives:    kubectl -n ircfiber-prod run bk --rm -it --image=busybox:1.36 \
#                   ssh ubuntu@ubuntu-docker 'sudo ls -lh /var/backups/ircfiber'
#
# Restore into a scratch namespace — never straight over prod. `--gzip` is
# REQUIRED or mongorestore rejects the archive:
#   mongorestore --uri "$MONGO_URL" --gzip --archive=/backups/mongo-<ts>.archive.gz \
#     --nsFrom 'ircfiber.*' --nsTo 'ircfiber_restore.*'
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ircfiber-mongo-backup
  namespace: ircfiber-prod
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: backup
spec:
  schedule: "17 3 * * *"          # 03:17 UTC daily
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600   # still runs after a node reboot within the hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            component: backup
        spec:
          restartPolicy: OnFailure
          # The node carries node.kubernetes.io/disk-pressure:NoSchedule (the
          # 1.7T filesystem it shares with the odysseus host sits at 93%, and
          # kubelet's default threshold is 10% free). A backup is precisely the
          # workload that must still run when the disk is tight, and its
          # archives are ~100 MB, so it tolerates the taint rather than waiting
          # for headroom that nothing here controls.
          tolerations:
            - key: node.kubernetes.io/disk-pressure
              operator: Exists
              effect: NoSchedule
          containers:
            - name: mongodump
              image: mongo:7
              command:
                - /bin/bash
                - -c
                - |
                  # No `set -e` here on purpose: the backup work runs inside
                  # work() so its exit code can be captured, then exactly one
                  # run record is published (success or failure), then the real
                  # exit code is returned. With `set -e` a failure would skip
                  # the publish and the admin Backups page would never learn
                  # the job had failed. `set -u` + `pipefail` stay on.
                  set -uo pipefail
                  KIND=mongo
                  START=$(date -u +%s)
                  OUT="/backups/mongo-$(date -u +%Y%m%d-%H%M%S).archive.gz"
                  STAGE=init

                  work() {
                    # Fail with instructions rather than handing mongodump an
                    # empty --uri, which errors out unrecognisably.
                    : "${MONGO_URL:?not set — create the ircfiber-backup-conn Secret, or (while the Rancher webhook is down and blocks Secret writes) kubectl -n ircfiber-prod set env cronjob/ircfiber-mongo-backup MONGO_URL=...}"
                    STAGE=dump;   mongodump --uri "$MONGO_URL" --gzip --archive="$OUT" --quiet; test -s "$OUT"
                    # A backup nobody has restored is a guess. A dry run reads
                    # the archive end to end and writes nothing, so the job only
                    # succeeds once the file has been proven parseable AND to
                    # carry the collections whose loss actually hurts.
                    STAGE=verify; mongorestore --uri "$MONGO_URL" --gzip --archive="$OUT" --dryRun --verbose \
                                    > /tmp/verify.log 2>&1
                                  for ns in users networks messages; do grep -q "ircfiber\.$ns" /tmp/verify.log \
                                    || { echo "FAILED: $ns missing from $OUT"; tail -20 /tmp/verify.log; return 1; }; done
                    # Retention: 14 dailies. Pruning only after a verified dump
                    # means a broken one can never evict a good one.
                    STAGE=prune;  find /backups -maxdepth 1 -name 'mongo-*.archive.gz' -mtime +14 -print -delete
                    STAGE=done
                  }

                  work > /tmp/run.log 2>&1; RC=$?
                  END=$(date -u +%s)

                  BYTES=0; [ -f "$OUT" ] && BYTES=$(stat -c '%s' "$OUT")
                  INV=""
                  for f in /backups/*; do
                    [ -f "$f" ] || continue
                    set -- $(stat -c '%s %Y' "$f")
                    INV="$INV{\"name\":\"$(basename "$f")\",\"bytes\":$1,\"mtime\":$2},"
                  done
                  INV="[${INV%,}]"
                  set -- $(df -P /backups | tail -1)   # $2 total, $3 used, $4 avail — 1K blocks
                  VOL="{\"totalBytes\":$(($2*1024)),\"usedBytes\":$(($3*1024)),\"availBytes\":$(($4*1024))}"
                  STATUS=ok; [ "$RC" -eq 0 ] || STATUS=failed
                  MSG=$(tail -3 /tmp/run.log | tr -d '"\\\n\r' | cut -c1-300)
                  REC="{\"schema\":1,\"kind\":\"$KIND\",\"status\":\"$STATUS\",\"stage\":\"$STAGE\",\
                  \"startedAt\":$((START*1000)),\"finishedAt\":$((END*1000)),\"durationMs\":$(((END-START)*1000)),\
                  \"file\":\"$(basename "$OUT")\",\"bytes\":$BYTES,\"node\":\"$(hostname)\",\
                  \"message\":\"$MSG\",\"snapshots\":$INV,\"volume\":$VOL}"
                  # Publish with the client already in this image (mongo:7 has
                  # no redis-cli, so the mongo job writes its record to the
                  # backup_runs collection the gateway already reads; the redis
                  # job publishes to irc:backup:runs instead). $REC is a valid
                  # JS object literal and every interpolated value is numeric
                  # or a [a-z0-9.-] filename. A publish failure must never
                  # change the job's own verdict — hence `|| echo warn`.
                  # 90-day history cap; the message tail is stripped of quotes,
                  # backslashes and newlines above so no log line can corrupt
                  # the record. Full detail stays in the pod log, which the
                  # admin Backups page can tail.
                  mongosh "$MONGO_URL" --quiet --eval "db.backup_runs.insertOne($REC); db.backup_runs.deleteMany({startedAt:{\$lt:$(( (START-7776000)*1000 ))}})" || echo "warn: publish failed"
                  cat /tmp/run.log
                  [ "$RC" -eq 0 ] && echo "OK $(du -h "$OUT" | cut -f1) $OUT"
                  exit $RC
              envFrom:
                # optional: the Rancher admission webhook on this cluster has
                # no endpoints (its pods cannot schedule under DiskPressure)
                # and fails closed, so `kubectl create secret` is refused
                # cluster-wide. Marking it optional lets the job run from
                # `kubectl set env` values until that is fixed, and pick the
                # Secret up automatically once it can be created.
                - secretRef:
                    name: ircfiber-backup-conn
                    optional: true
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: backups
              # hostPath, not a PVC: local-path provisioning runs a helper pod
              # that carries no disk-pressure toleration, so on this tainted
              # node the claim never binds ("create process timeout after 120
              # seconds"). A node directory needs no provisioner, survives
              # namespace churn, and is trivial to rsync off-box.
              hostPath:
                path: /var/backups/ircfiber
                type: DirectoryOrCreate
---
# Redis holds preferences, per-network engine state and sessions. `--rdb` asks
# the server for a fresh dump over the wire, so it needs no access to the OVH
# filesystem.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ircfiber-redis-backup
  namespace: ircfiber-prod
  labels:
    app.kubernetes.io/part-of: ircfiber
    component: backup
spec:
  schedule: "37 3 * * *"          # 20 minutes after the Mongo job
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            component: backup
        spec:
          restartPolicy: OnFailure
          tolerations:                       # see the Mongo job above
            - key: node.kubernetes.io/disk-pressure
              operator: Exists
              effect: NoSchedule
          containers:
            - name: redis-rdb
              image: redis:7-alpine
              command:
                - /bin/sh
                - -c
                - |
                  # No `set -e` here on purpose: the backup work runs inside
                  # work() so its exit code can be captured, then exactly one
                  # run record is published (success or failure), then the real
                  # exit code is returned. `set -u` stays on.
                  set -u
                  KIND=redis
                  START=$(date -u +%s)
                  OUT="/backups/redis-$(date -u +%Y%m%d-%H%M%S).rdb"
                  STAGE=init

                  work() {
                    : "${REDIS_URL:?not set — see the Secret note on the Mongo job above}"
                    STAGE=dump;   redis-cli -u "$REDIS_URL" --rdb "$OUT"; test -s "$OUT"
                    # An RDB file starts with the magic "REDIS"; anything else
                    # means we saved an error, not a database.
                    STAGE=verify; head -c 5 "$OUT" | grep -q REDIS \
                                    || { echo "FAILED: $OUT is not an RDB"; return 1; }
                    STAGE=prune;  find /backups -maxdepth 1 -name 'redis-*.rdb' -mtime +14 -print -delete
                    STAGE=done
                  }

                  work > /tmp/run.log 2>&1; RC=$?
                  END=$(date -u +%s)

                  BYTES=0; [ -f "$OUT" ] && BYTES=$(stat -c '%s' "$OUT")
                  INV=""
                  for f in /backups/*; do
                    [ -f "$f" ] || continue
                    set -- $(stat -c '%s %Y' "$f")
                    INV="$INV{\"name\":\"$(basename "$f")\",\"bytes\":$1,\"mtime\":$2},"
                  done
                  INV="[${INV%,}]"
                  set -- $(df -P /backups | tail -1)   # $2 total, $3 used, $4 avail — 1K blocks
                  VOL="{\"totalBytes\":$(($2*1024)),\"usedBytes\":$(($3*1024)),\"availBytes\":$(($4*1024))}"
                  STATUS=ok; [ "$RC" -eq 0 ] || STATUS=failed
                  MSG=$(tail -3 /tmp/run.log | tr -d '"\\\n\r' | cut -c1-300)
                  REC="{\"schema\":1,\"kind\":\"$KIND\",\"status\":\"$STATUS\",\"stage\":\"$STAGE\",\
                  \"startedAt\":$((START*1000)),\"finishedAt\":$((END*1000)),\"durationMs\":$(((END-START)*1000)),\
                  \"file\":\"$(basename "$OUT")\",\"bytes\":$BYTES,\"node\":\"$(hostname)\",\
                  \"message\":\"$MSG\",\"snapshots\":$INV,\"volume\":$VOL}"
                  # Publish with the client already in this image (redis:7-alpine
                  # has redis-cli; mongo:7 has none, so the mongo job writes to
                  # the backup_runs collection instead). A publish failure must
                  # never change the job's own verdict. LPUSH + LTRIM 0 59 keeps
                  # the last 60 records; the message tail is stripped of quotes,
                  # backslashes and newlines above so no log line can corrupt
                  # the record. Full detail stays in the pod log, which the
                  # admin Backups page can tail.
                  redis-cli -u "$REDIS_URL" LPUSH irc:backup:runs "$REC" >/dev/null || echo "warn: publish failed"
                  redis-cli -u "$REDIS_URL" LTRIM irc:backup:runs 0 59 >/dev/null || true
                  cat /tmp/run.log
                  [ "$RC" -eq 0 ] && echo "OK $(du -h "$OUT" | cut -f1) $OUT"
                  exit $RC
              envFrom:
                - secretRef:
                    name: ircfiber-backup-conn
                    optional: true          # see the Mongo job above
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backups
              # hostPath, not a PVC: local-path provisioning runs a helper pod
              # that carries no disk-pressure toleration, so on this tainted
              # node the claim never binds ("create process timeout after 120
              # seconds"). A node directory needs no provisioner, survives
              # namespace churn, and is trivial to rsync off-box.
              hostPath:
                path: /var/backups/ircfiber
                type: DirectoryOrCreate
