# SigNoz Helm values for k3s single-node (ubuntu@ubuntu-docker)
# Chart: signoz/signoz 0.138.0 (app v0.138.0) — actual installed; pins ClickHouse 25.12.5, otel-collector v0.144.8
# Original pin intended 0.131.0 (app v0.131.1) for ClickHouse 25.8 / otel 0.144.5, but chart forces 25.12.5 — accepted per plan fallback.
# Matches site/deploy/roles/logging/defaults/main.yml signoz_version v0.131.1 / signoz_ingester_version v0.144.5
# If any key does not exist in the chart's values.yaml, keep chart default and note deviation here.

global:
  # Only provisioner on ubuntu-docker is rancher.io/local-path (WaitForFirstConsumer)
  storageClass: local-path
  clusterName: ubuntu-docker

# ---- ClickHouse (telemetry store) ----
clickhouse:
  enabled: true
# Single replica — chart 0.138.0 requires ZooKeeper for ReplicatedMergeTree even with shardsCount:1.
# Fallback pre-decided in plan: enable ZK single replica with 1Gi PVC (chart default).
  # Original preference was cluster.enabled=false / zookeeper.enabled=false, but install failed with
  # "Cannot use any of provided ZooKeeper nodes" (migrator 999). Enabled per plan fallback.
  zookeeper:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: local-path
      size: 5Gi
  # Auth — DSN must be tcp://signoz:signoz123@clickhouse:9000 matching docker SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
  # Chart generates random admin password; we override via secret template? For now keep chart-generated password
  # and document DSN. If chart supports clickhouse.auth.password, override to signoz123.
  # Deviation: chart 0.131.0 does not expose clickhouse.auth.password directly; password is generated
  # in ClickHouseInstallation users.admin/password. Chart default retained with note.
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi # covers ~30d of cluster logs; host has 934G free
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
# ---- SigNoz queryService + frontend (merged Deployment "signoz") ----
signoz:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Indoor footprint ~1Gi vs host 125Gi — safe. Frontend merged into signoz on :8080.
  env:
    # JWT secret — reuse site/deploy/roles/logging/defaults/main.yml signoz_jwt_secret default
    # Production should override via vault_signoz_jwt_secret.
    SIGNOZ_JWT_SECRET: ircfiber-signoz-dev-jwt-secret-change-in-prod-9e3a7f2b
    # Telemetry store DSN — chart sets internally from ClickHouseInstallation; keep provider=clickhouse.
    signoz_telemetrystore_provider: clickhouse
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: signoz.ubuntu-docker.tail544547.ts.net
        paths:
          - path: /
            pathType: Prefix
            port: 8080
    tls: []
    # No cert-manager ClusterIssuer on ubuntu-docker (kubectl get clusterissuer → none); use Traefik default cert.
    # If letsencrypt-prod ClusterIssuer appears, add annotation cert-manager.io/cluster-issuer: letsencrypt-prod.

# ---- Otel Collector (signoz chart) ----
otelCollector:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
  # Chart deploys otel-collector as Deployment (not DaemonSet). For single-node hostmetrics,
  # we add hostmetrics receiver + resourcedetection processor per
  # https://signoz.io/docs/infrastructure-monitoring/user-guides/hostmetrics/#configure-the-hostmetrics-receiver
  # and https://signoz.io/docs/infrastructure-monitoring/user-guides/hostmetrics/#configure-the-processors
  # Hostmetrics needs host filesystem mount /hostfs and OTEL_RESOURCE_ATTRIBUTES for k8s.cluster.name.
  # Deviation: chart 0.138.0 has no DaemonSet mode; we use Deployment with hostfs mount for single-node.
  # In-cluster pod logs/metrics come from the separate signoz/k8s-infra chart (namespace k8s-infra);
  # its otel-agent MUST use otelCollectorEndpoint=http://signoz-otel-collector.signoz.svc.cluster.local:4318
  # (otlphttp exporter — a scheme-less :4317 endpoint silently rejects every batch with "sending queue is full").
  additionalEnvs:
    OTEL_RESOURCE_ATTRIBUTES: "k8s.cluster.name=ubuntu-docker,host.name=ubuntu-docker"
    LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    TENANT_ID: single-tenant
  extraVolumes:
    - name: hostfs
      hostPath:
        path: /
        type: Directory
  extraVolumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
  # Dedicated OVH ingress ports. OVH (vps-efb4b52d) ships fluent-bit + engine/gateway OTLP over
  # Tailscale to the operator-exposed Service (svc:otel-collector, 100.79.88.61 /
  # otel-collector.tail544547.ts.net) on 4319 (http) / 4320 (grpc). These feed the */ovh pipelines
  # below, which skip k8sattributes so OVH resource attrs (service.name, k8s.cluster.name=ovh-prod)
  # are stored verbatim. Ingress into the collector pod is gated by NetworkPolicy allow-signoz-otel
  # (site/deploy/k8s/ircfiber/networkpolicy.yaml) — keep it in sync when adding sources.
  ports:
    otlp-ovh-http:
      enabled: true
      containerPort: 4319
      servicePort: 4319
      nodePort: ""
      protocol: TCP
    otlp-ovh-grpc:
      enabled: true
      containerPort: 4320
      servicePort: 4320
      nodePort: ""
      protocol: TCP
  config:
    receivers:
      otlp/ovh:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
          grpc:
            endpoint: 0.0.0.0:4320
      hostmetrics:
        collection_interval: 60s
        root_path: /hostfs
        scrapers:
          cpu: {}
          disk: {}
          load: {}
          filesystem: {}
          memory: {}
          network: {}
          paging: {}
          process:
            mute_process_name_error: true
            mute_process_exe_error: true
            mute_process_io_error: true
            mute_process_user_error: true
          processes: {}
          system: {}
    processors:
      batch:
        send_batch_size: 50000
        timeout: 5s
      # k8scluster detector needs API access the collector-egress-allow NetworkPolicy blocks; env+system only.
      resourcedetection:
        detectors: [env, system]
      # passthrough: without it, k8sattributes dropped every record lacking a k8s.pod.ip (all OVH logs).
      k8sattributes:
        extract:
          metadata:
            - k8s.pod.uid
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
        passthrough: true
      # OVH fluent-bit docker logs arrive with an empty resource (fluent-bit classic config cannot
      # set OTLP resource attrs). Promote the lua-derived container_name log attribute to
      # service.name (container names == SDK service names: ircfiber-engine-ovh, ircfiber-gateway)
      # and stamp cluster identity. `insert` never overwrites what the engine/gateway SDKs send.
      transform/ovh:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], attributes["container_name"]) where resource.attributes["service.name"] == nil and attributes["container_name"] != nil
      resource/ovh:
        attributes:
          - key: k8s.cluster.name
            value: ovh-prod
            action: insert
          - key: host.name
            value: ovh-prod
            action: insert
          - key: deployment.environment
            value: production
            action: insert
          - key: service.name
            value: ovh-docker
            action: insert
    exporters:
      # Chart default; pinned because the pre-migration false wrote to the signoz_logs.logs VIEW and
      # failed with NOT_IMPLEMENTED "Method write is not supported by storage View".
      clickhouselogsexporter:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_LOG_DATABASE}
        timeout: 10s
        use_new_schema: true
    service:
      pipelines:
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [resourcedetection, batch]
          exporters: [signozclickhousemetrics, signozmeter, metadataexporter]
        traces:
          receivers: [otlp, jaeger]
          processors: [k8sattributes, signozspanmetrics/delta, batch]
          exporters: [clickhousetraces, metadataexporter, signozmeter]
        logs:
          receivers: [otlp, httplogreceiver/heroku, httplogreceiver/json]
          processors: [batch]
          exporters: [clickhouselogsexporter, signozmeter, metadataexporter]
        # OVH (ovh-prod) pipelines — no k8sattributes/resourcedetection so remote resource attrs survive.
        logs/ovh:
          receivers: [otlp/ovh]
          processors: [transform/ovh, resource/ovh, batch]
          exporters: [clickhouselogsexporter, signozmeter, metadataexporter]
        traces/ovh:
          receivers: [otlp/ovh]
          processors: [signozspanmetrics/delta, batch]
          exporters: [clickhousetraces, metadataexporter, signozmeter]
        metrics/ovh:
          receivers: [otlp/ovh]
          processors: [batch]
          exporters: [signozclickhousemetrics, signozmeter, metadataexporter]

# ---- Global env fallback (if chart ever templates global.env) ----
# Some forks expose global.env.SIGNOZ_JWT_SECRET; we keep signoz.env above as authoritative.
