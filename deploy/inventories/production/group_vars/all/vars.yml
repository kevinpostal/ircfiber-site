---
# IRC Fiber — public defaults (safe to commit)
# Override per host in inventories/production/host_vars/<hostname>.yml

# --- Versions -----------------------------------------------------------------
ircfiber_version: "0.3.0"
ircfiber_session_ttl_days: 90

# --- Image registry ------------------------------------------------------------
# Images are built on the builder host (`make ship` / `make ship-engine` in
# ircfiber-infra) and pushed to GHCR; prod only ever pulls. Deploys address
# images by digest; `:prod` is the tag `ship` promotes after a successful swap
# and is what provisioning (site.yml) pulls.
docker_registry_url: "ghcr.io"
docker_registry_namespace: "kevinpostal"
docker_image_tag: "prod"

# --- Public-facing ------------------------------------------------------------
ircfiber_domain: "ircfiber.com"
# Email used by Caddy for Let's Encrypt ACME registration (only used when
# ircfiber_use_lets_encrypt is true)
# Left empty: the committed value was the literal "[email protected]" (a
# Cloudflare email-obfuscation artifact), which rendered `tls [email protected]`
# and crash-looped Caddy on 2026-09-02. Set a real address in host_vars/vault
# to register the ACME account; Let's Encrypt works without one.
ircfiber_acme_email: ""
# When true, Caddy requests a real Let's Encrypt cert (requires DNS for
# ircfiber_domain to point at the host's public IP and port 80/443 open).
# When false, Caddy uses a local self-signed cert — convenient for the
# /etc/hosts trick to access the host via its Tailscale IP. Browsers will
# show a cert warning; click through to proceed.
ircfiber_use_lets_encrypt: false

# --- Container runtime --------------------------------------------------------
mongo_image: "mongo:7"
redis_image: "redis:7-alpine"
caddy_image: "caddy:2-alpine"

# --- Tailscale ----------------------------------------------------------------
# Tag applied to all ircfiber hosts; use in Tailscale ACLs to scope the mesh.
tailscale_tags: "tag:ircfiber"
# Where to find tailscaled state
tailscale_state_dir: "/var/lib/tailscale"

# --- Internal networking -------------------------------------------------------
# The Docker bridge network used by gateway/caddy (and for management of backend containers).
docker_ircfiber_subnet: "172.30.0.0/16"
docker_ircfiber_network: "ircfiber_net"
docker_ircfiber_gateway: "172.30.0.1"
# Dual-stack: ULA prefix for container IPv6 on ircfiber_net. Inbound public
# v6 reaches published ports via Docker's ip6tables DNAT (no per-container
# public address needed); outbound container v6 uses this prefix. Changing
# either subnet requires recreating the network (all attached containers
# restart) — plan a maintenance window.
docker_ircfiber_subnet_v6: "fd00:f1b3:1::/64"

# --- Firewall -----------------------------------------------------------------
firewall_enabled: true
firewall_allow_ssh_cidr: "0.0.0.0/0"
# Whether to allow the engine admin port (8091) from the Tailscale subnet only.
firewall_open_engine_admin: true
# Public bouncer port (bnc.<domain>:7000 TLS).
firewall_extra_tcp_ports:
  - 7000
# --- Mongo --------------------------------------------------------------------
mongo_data_volume: "ircfiber_mongo_data"
mongo_initdb_database: "ircfiber"
mongo_port: 27017
mongo_replica_init: true
mongo_replica_members:
  - host: "{{ host_tailscale_ip }}"
    port: "{{ mongo_port }}"
    priority: 10

# --- Redis --------------------------------------------------------------------
redis_data_volume: "ircfiber_redis_data"
redis_port: 6379
redis_maxmemory: "256mb"
redis_appendonly: true

# --- Gateway ------------------------------------------------------------------
gateway_http_port: 8090
gateway_uploads_volume: "ircfiber_uploads"
gateway_logs_volume: "ircfiber_logs"
# Number of gateway container replicas (1 = single, backward-compatible name).
# Raise to 2-4 for process-level isolation and horizontal scale on the same host.
gateway_replica_count: 1
# When true and replica_count > 1, Caddy uses ip_hash load balancing so
# WebSocket clients stay pinned to the same replica.
gateway_replica_sticky: true
# Swappable API backend (Step 3): D gateway (default) vs Python gateway.
# When gateway_use_python is true, Caddy proxies /api/* and /ws to
# irc-fiber-api-py:8000 instead of ircfiber-gateway:8090. Frontend needs
# no rebuild — it keeps API_BASE=/api behind Caddy. Toggle via
# `gateway_use_python: true` in host_vars or with `--extra-vars`.
gateway_backend_host: "ircfiber-gateway"
gateway_backend_port: "{{ gateway_http_port }}"
gateway_use_python: false
gateway_python_host: "irc-fiber-api-py"
gateway_python_port: 8000
# --- Bouncer ("Connect with another client…") ---------------------------------
# Dedicated container from the gateway image; only a process with
# IRCFIBER_BNC_PORT set listens. TLS terminates in-process using the LE
# cert Caddy obtains for bnc_public_host (mounted read-only from the Caddy
# data volume). Add bnc_public_host to caddy_extra_serve_hosts and a
# non-proxied Cloudflare A record for it (see host_vars).
bnc_enabled: true
bnc_public_host: "bnc.{{ ircfiber_domain }}"
bnc_public_port: 7000
bnc_container_name: "ircfiber-bnc"
bnc_tls_cert_path: "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ bnc_public_host }}/{{ bnc_public_host }}.crt"
bnc_tls_key_path: "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ bnc_public_host }}/{{ bnc_public_host }}.key"
# Protocol trace (every BNC client/server line at info, PASS redacted).
# High volume — set true only to diagnose drops, then redeploy with false.
bnc_trace: false
# --- #support services bot (same gateway image, dedicated container) --------
# Only the process with IRCFIBER_SUPPORT_BOT_ENABLED=1 connects to the ircd
# (docker alias from IRCFIBER_IRCD_HOST/PORT in env.j2) as FIBERSUPPORT and
# announces Help & Feedback reports in #support. Never set on the
# blue/green gateway replicas. NickServ password: vault_support_bot_nickserv_password.
support_bot_enabled: true
support_bot_container_name: "ircfiber-support-bot"
support_bot_nick: "FIBERSUPPORT"
# First entry is the announcement channel; the bot also answers commands
# in every other joined channel (#ircfiber is the staff-visible main one).
support_bot_channel: "#support,#ircfiber"
support_bot_public_url: "https://{{ ircfiber_domain }}"
# --- FiberEye connection watch + #staff announcer (dedicated container) -----
# Only the process with IRCFIBER_FIBEREYE_ENABLED=1 opens an opered IRC
# connection to the ircd as FIBEREYE. It OPERs as {{ fibereye_oper_name }}
# with snomasks cCqx (connects, remote connects, quits, X-lines), persists
# every session in Mongo behind the admin #/fibereye page, assembles the IP
# intelligence record for every public connect, places timed Z-lines on
# connect floods, and sits in {{ fibereye_channel }} announcing the Redis
# outbox: signups, outbound mail, connects (with the record), admin notices
# and backup runs. It replaced the FiberLogs bot (ircfiber-logs-bot). Never
# set on the blue/green gateway replicas.
# Enforcement ships DISARMED — the Redis key `fibereye:armed` arms it, and the
# admin page's Arm button is the only thing that sets it. Secrets:
# vault_fibereye_nickserv_password, vault_ircd_fibereye_oper_password,
# vault_ipinfo_token and the optional vault_proxycheck_key / vault_iphub_key /
# vault_ipapi_is_key.
fibereye_enabled: true
fibereye_container_name: "ircfiber-fibereye"
fibereye_nick: "FIBEREYE"
fibereye_channel: "#staff"
fibereye_oper_name: "fibereye"
# Connect classes whose connects are never counted, banned or announced: the
# engine multiplexes every platform user through container IPs (useless geo),
# loopback is the ircd's own healthcheck, and localhost-v6 is there because
# banning the healthcheck source would take the whole platform offline.
fibereye_ignore_classes: "ircfiber-engine,ircfiber-engine-v6,localhost,localhost-v6"
# IP groups that are recorded but never counted and never banned. Entries may
# be an IP group verbatim, any CIDR covering the address, a glob or a bare
# address -- matched with the same predicate as a Z-line mask.
#
# Both entries are the operator's own home network, v6 and v4, and both are
# the addresses the 2026-09 "flood" sample was attributed to -- which means
# that sample was very likely our own client reconnecting, not an attack.
# Arming enforcement without them would Z-line the operator out of their own
# network. Both verified from live fibereye_sessions rows: the v6 address
# grouped to exactly this /64, and 76.32.236.21 is where the bouncer probes
# come from.
#
# Keep this list to addresses we can prove are ours. Anything wider is a
# hole: an exempt group is never counted, so it can never be banned however
# hard it floods.
fibereye_exempt_ips: "2603:8001:98f0:1530::/64,76.32.236.21"
# Nicks whose connects are recorded but never counted and never banned.
# Exact nicks or `*`/`?` globs, matched case-insensitively — `p34c3*`
# covers the bouncer alts (`p34c3_`, `p34c3_e5eb`) behind the shared exit
# below. Only the nick's own connects are skipped, so the strangers
# sharing that exit are still counted and still bannable.
fibereye_exempt_nicks: "p34c3*"
# Public addresses excused from the ircd's own <connectban> (and
# <connflood>) via a dedicated connect class in inspircd.conf.j2 — the
# 5-minute Z-lines in #staff come from there, not from the FiberEye bot,
# so a FiberEye exemption alone cannot stop them. 185.206.149.176 is a
# shared exit whose strangers reconnect ~8x/hour and loop-ban it forever;
# excusing it stops the loop. The exit stays under FiberEye's own rules
# (above), which place longer, appealable, admin-visible bans — a real
# flood from it still earns a Z-line there.
# Space- or comma-separated; rendered into the class's allow list.
ircd_connectban_exempt_ips: "185.206.149.176"
# Detection window and the three rules evaluated inside it, per IP group (the
# exact address for IPv4, the /64 for IPv6). Opening values chosen against the
# 2026-09 flood sample; the admin card shows what is actually in force, so
# retune from real candidates before arming.
fibereye_window: 60
fibereye_connect_threshold: 10
fibereye_nick_threshold: 6
fibereye_churn_threshold: 6
# A session shorter than this counts towards the churn rule.
fibereye_short_ms: 20000
# First strike; the second is x24 and the third and later x168.
fibereye_ban_seconds: 3600
# --- SigNoz query API (admin Logs page, gateway-side proxy) ------------------
# The gateway container has no Tailscale MagicDNS, so the URL is the
# tailnet IP with a Host-header override for the SNI-routed Traefik
# ingress. Traefik serves its default self-signed cert -> insecure TLS
# stays on (transport is still WireGuard-encrypted end to end).
signoz_query_url: "https://100.94.116.56"
signoz_query_host: "signoz.ubuntu-docker.tail544547.ts.net"
signoz_insecure_tls: true
# k3s API on ubuntu-docker over the tailnet. Backs the admin Backups page
# (GET /api/admin/backups). A group var because k3s_tailscale_ip exists only
# in host_vars/ircfiber-prod-1.yml, which does not apply to vps-efb4b52d.
k3s_api_url: "https://100.94.116.56:6443"
# --- Caddy --------------------------------------------------------------------
caddy_data_volume: "ircfiber_caddy_data"
caddy_config_volume: "ircfiber_caddy_config"

# --- Backups ------------------------------------------------------------------
backup_dir: "/var/backups/ircfiber"
backup_keep_days: 14
backup_s3_enabled: false
backup_s3_bucket: ""
backup_s3_prefix: "ircfiber/"

# --- Operations ---------------------------------------------------------------
common_upgrade: false
image_prune_keep_count: 3

# --- Images -------------------------------------------------------------------
ircfiber_gateway_image_name: >-
  {{ (docker_registry_url + '/' if (docker_registry_url | length > 0) else '')
     + docker_registry_namespace + '/irc-fiber-gateway' }}
ircfiber_gateway_image_full: "{{ ircfiber_gateway_image_name }}:{{ docker_image_tag }}"

ircfiber_engine_image_name: >-
  {{ (docker_registry_url + '/' if (docker_registry_url | length > 0) else '')
     + docker_registry_namespace + '/ircfiber-engine' }}
ircfiber_engine_image_full: "{{ ircfiber_engine_image_name }}:{{ docker_image_tag }}"

# Connection holder (owns the engine's IRC sockets; roles/holder). Built from
# the same Containerfile.engine, stage runtime-holder, by `make ship-holder`.
ircfiber_holder_image_name: >-
  {{ (docker_registry_url + '/' if (docker_registry_url | length > 0) else '')
     + docker_registry_namespace + '/ircfiber-holder' }}
ircfiber_holder_image_full: "{{ ircfiber_holder_image_name }}:{{ docker_image_tag }}"

# --- Engine defaults ----------------------------------------------------------
# NOTE: ircfiber_engine_id has NO default — it MUST be set per-host in
# host_vars/<hostname>.yml or via inline inventory vars. The old default
# of "{{ inventory_hostname_short }}" silently leaked hostnames like
# ircfiber-ovh-1 as engine server IDs, creating duplicate registrations
# in Redis when the correct host_vars override wasn't applied.
# Every engine host in [ircfiber_engines] must define its own id.
ircfiber_engine_bind_address: "0.0.0.0"
ircfiber_engine_admin_port: 8091
ircfiber_engine_log_level: "info"
# Per-user IPv6 (IRCCloud-style): routed prefix giving each user their own IP.
# Leave empty to disable (fallback to direct/Mullvad). Example: "2001:db8:abcd:0012::/64"
# When set, host is auto-configured with ip_nonlocal_bind + local route so any
# IID in the prefix is bindable without per-user ip addr add.
ircfiber_ipv6_prefix: ""
# rDNS pool host for id-<uid>.pool (e.g. "highgate.ircfiber.com") — optional, for PTR/WHOIS
ircfiber_ipv6_pool_host: ""

# --- Gateway defaults ---------------------------------------------------------
ircfiber_gateway_log_level: "info"
ircfiber_admin_password: "{{ vault_ircfiber_admin_password }}"  # set in vault.yml — no default

# --- Signup email verification -------------------------------------------
ircfiber_email_verification: true
# "resend" | "sender" | "log" (ircfiber.mail). Resend's ircfiber.com is
# verified (DKIM + the send-subdomain SPF/MX live in host_vars'
# cloudflare_records); the sender.net account it replaced is suspended.
ircfiber_mail_provider: "resend"
ircfiber_mail_from: "no-reply@ircfiber.com"
ircfiber_mail_from_name: "IRC Fiber"
ircfiber_public_url: "https://ircfiber.com"

# --- Social OAuth signup/signin --------------------------------------------
# One OAuth app per provider, each registered with redirect URI
# https://ircfiber.com/auth/<name>/callback. All empty = all providers off
# by default; secrets live in vault.yml (vault_oauth_<name>_client_secret).
# GitHub: Settings → Developer settings → OAuth Apps; Google: Cloud console
# → Credentials → OAuth client (Web); Codeberg: Settings → Applications
# (confidential client); GitLab: User Settings → Applications (scopes
# read_user, openid, email).
ircfiber_oauth_github_client_id: "Ov23li7FovcvgvyDtD3J"
ircfiber_oauth_google_client_id: "650470972727-h06s7ueb29t0e6grm8441u1d4ahc0d06.apps.googleusercontent.com"
ircfiber_oauth_codeberg_client_id: "3f808a0c-be5c-442c-b7af-d7ae94b17954"
ircfiber_oauth_gitlab_client_id: "76c37fd353bd92e5bbc2de870f247b7728c18484fb8cb9dd6db47b492a17b82d"

# --- IRCd (InspIRCd 4 + Anope 2 services) --------------------------------------
# Pinned upstream images (multi-arch). Anope 2.0.x links to InspIRCd 4 via
# its inspircd3 protocol module.
ircd_port_plain: 6667
ircd_port_tls: 6697
# Our own build of InspIRCd 4 (roles/ircd/files/Containerfile.ircd): upstream
# v4.11.0 plus exactly one third-party module, motdpool
# (roles/ircd/files/motdpool/m_motdpool.cpp). Built and promoted to :prod by
# `make ship-ircd`, which deploys by digest via playbooks/ircd-deploy.yml.
ircd_image_registry: >-
  {{ (docker_registry_url + '/' if (docker_registry_url | length > 0) else '')
     + docker_registry_namespace + '/irc-fiber-ircd' }}
ircd_image: "{{ ircd_image_registry }}:{{ docker_image_tag }}"
ircd_container_name: "ircfiber-ircd"
# /inspircd/data — xline.db, permchannels.conf. (The old Ergo volume
# ircfiber_ircd_data is left in place untouched for rollback.)
ircd_data_volume: "ircfiber_inspircd_data"
ircd_services_image: "anope/anope:2.0.20"
ircd_services_container_name: "ircfiber-services"
ircd_services_data_volume: "ircfiber_services_data"
# Anope XML-RPC (m_httpd + m_xmlrpc + m_xmlrpc_main). Used by the gateway to
# register website accounts with NickServ (ircfiber.services.anope). The
# services container publishes no ports, so the listener is reachable only
# from containers on {{ docker_ircfiber_network }}. m_xmlrpc has no auth of
# its own — never publish this port.
ircd_services_rpc_enabled: true
ircd_services_rpc_port: 8080

# Our own ircd's server name. Also here, not only in roles/ircd defaults,
# because roles/engine's env.j2 needs it: the engine role runs in its own
# play (hosts: ircfiber_engines) where the ircd role's defaults are not in
# scope at all.
ircd_server_name: "irc.ircfiber.com"

# Link the k3s spanningtree leaf (playbooks/ircd-k8s-leaf.yml). The hub is
# the connecting side, so this needs only a rehash, never a restart.
ircd_k8s_link_enabled: true
# Leaf server name, here for the same reason as ircd_server_name above:
# roles/engine's env.j2 names it in IRCFIBER_FLOOD_TRUSTED_HOSTS and runs in
# a play where roles/ircd defaults are not in scope.
ircd_k8s_leaf_name: "k8s.ircfiber.com"

# Flood parameters of the InspIRCd `ircfiber-engine` connect class. Single
# source of truth: consumed BOTH by roles/ircd (inspircd.conf.j2, the actual
# server-side limit) and by roles/engine (env.j2, the engine's client-side
# model of it). They must never drift — the engine paces itself against
# these numbers, and `fakelag="no"` on that class means exceeding the
# threshold is an Excess Flood KILL, not a delay.
# commandrate is millicommands/second: 100000 = 100 commands/second.
ircd_engine_commandrate: 100000
# threshold is command penalty points (a normal command costs 1).
ircd_engine_threshold: 100

# --- Cloudflare DNS ------------------------------------------------------------
# Used by the `cloudflare` role to point DNS records at this host's public IP.
# `cloudflare_zone` is the registered domain (the zone that owns the records).
# Override per host in inventories/production/host_vars/<hostname>.yml.
# `cloudflare_target_ip` MUST be set in host_vars; the playbook refuses to
# auto-discover it (use `tailscale netcheck` to find the right value).
#
# When using Cloudflare Tunnel (cloudflared), DNS records are managed
# automatically by Cloudflare Zero Trust when you add Public Hostnames to
# the tunnel. The `cloudflare` role for manual A records becomes optional.
cloudflare_zone: "ircfiber.com"          # the registered CF zone
cloudflare_proxied: false                # true = orange cloud (CF proxies traffic),
                                         # false = DNS-only (CF is just authoritative DNS)
cloudflare_record_ttl: 300                # seconds; only used when cloudflare_proxied=false
cloudflare_record_prefixes:               # record names under cloudflare_zone to manage
  - "@"                                  # apex (e.g. ircfiber.com)
  - "www"                                # e.g. www.ircfiber.com

# --- Cloudflare Tunnel (cloudflared) -------------------------------------------
cloudflared_image: "cloudflare/cloudflared:latest"
cloudflared_container_name: "ircfiber-cloudflared"
cloudflared_no_autoupdate: true
cloudflared_restart_policy: "unless-stopped"
# Port Caddy listens on for tunnel-originated HTTP traffic.
# Must match caddy_tunnel_port in the Caddy role defaults.
cloudflared_caddy_tunnel_port: 8080

# --- Preflight assertions -----------------------------------------------------
ircfiber_min_docker_version: "20.10.0"
ircfiber_min_ubuntu_codename: ["jammy", "noble"]   # 22.04, 24.04
ircfiber_min_debian_codename: ["bookworm", "bullseye"]
