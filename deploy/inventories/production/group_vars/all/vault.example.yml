---
# IRC Fiber — operator secrets (Ansible Vault template).
#
# Copy this file to `vault.yml` and replace the placeholders, then encrypt:
#
#   cp inventories/production/group_vars/all/vault.example.yml \
#      inventories/production/group_vars/all/vault.yml
#   # edit vault.yml and replace CHANGE_ME with the real value
#   ansible-vault encrypt inventories/production/group_vars/all/vault.yml
#
# vault.yml is matched by the .gitignore rule `inventories/**/vault.yml`
# and will never be committed. Decryption uses the key in
# deploy/.vault_pass.txt (also gitignored) per ansible.cfg.
#
# Run any playbook against this inventory without -e flags; Ansible will
# auto-decrypt the vault using vault_password_file from ansible.cfg.

vault_signoz_admin_password: "CHANGE_ME"
# sender.net → Account settings → API access tokens. Feeds the gateway
# sender_api_token secret file for signup email verification.
vault_sender_api_token: "CHANGE_ME"
# Resend → API Keys (a send-only key is enough for the gateway; managing
# domains needs a full-access one). Feeds the resend_api_key secret file and
# is what IRCFIBER_MAIL_PROVIDER=resend reads. The sending domain must be
# verified in Resend first, or every send answers HTTP 403 "domain is not
# verified".
vault_resend_api_key: "CHANGE_ME"
# Social OAuth signup/signin (ircfiber.oauth). IDs stay empty (in vars.yml)
# until the matching app is registered; secrets are filled here. An empty
# secret removes the secret file and the provider reads as unconfigured.
# GitHub → Settings → Developer settings → OAuth Apps (client secret).
vault_oauth_github_client_id: ""
vault_oauth_github_client_secret: ""
# Google → Cloud console → Credentials → OAuth client (Web).
vault_oauth_google_client_id: ""
vault_oauth_google_client_secret: ""
# Codeberg → Settings → Applications (confidential client).
vault_oauth_codeberg_client_id: ""
vault_oauth_codeberg_client_secret: ""
# GitLab → User Settings → Applications (scopes read_user, openid, email).
vault_oauth_gitlab_client_id: ""
vault_oauth_gitlab_client_secret: ""