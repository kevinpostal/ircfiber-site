---
# IRC Fiber — vault template (REDACTED — safe to commit)
# Copy this file to vault.yml, fill in real values, and run:
#   ansible-vault encrypt inventories/production/group_vars/vault.yml
# All keys MUST be defined (even if empty string for unused ones) so the
# playbooks don't fail with undefined variables.

# --- Tailscale ----------------------------------------------------------------
vault_tailscale_authkey: "tskey-auth-REPLACE-ME"

# --- Docker registry ----------------------------------------------------------
vault_docker_registry_username: "REPLACE-ME"
vault_docker_registry_password: "REPLACE-ME"

# --- MongoDB ------------------------------------------------------------------
# Root credentials used by the init container
vault_mongo_root_username: "root"
vault_mongo_root_password: "REPLACE-WITH-STRONG-PASSWORD"

# Application user used by gateway + engine to talk to the ircfiber DB
vault_mongo_app_username: "ircfiber"
vault_mongo_app_password: "REPLACE-WITH-STRONG-PASSWORD"

# --- Redis --------------------------------------------------------------------
vault_redis_password: "REPLACE-WITH-STRONG-PASSWORD"

# --- IRC Fiber admin user (overrides source/app.d default 'REDACTED') ---------
# When set to a non-empty value, the gateway will reset the admin password on
# every start to match this value. Leave empty to keep the in-source default.
vault_ircfiber_admin_password: ""

# --- Backup S3 (optional) -----------------------------------------------------
vault_aws_access_key: ""
vault_aws_secret_key: ""

# --- Cloudflare DNS (direct API) ---------------------------------------------
# Used by the `cloudflare` role to manage DNS records for the domain(s) that
# should resolve to this stack's public IP. Create a scoped token at
# https://dash.cloudflare.com/profile/api-tokens with permission
#   Zone:DNS:Edit   (scoped to the specific zone you'll be managing)
# The account ID is shown in the Cloudflare dashboard sidebar on any zone.
# DO NOT commit the real values to this file — fill them into the encrypted
# vault.yml via `ansible-vault edit`.
vault_cloudflare_api_token: "REPLACE-WITH-CF-API-TOKEN"
vault_cloudflare_account_id: "REPLACE-WITH-CF-ACCOUNT-ID"

# --- IRCd (InspIRCd + Anope) ----------------------------------------------------
# Oper password: /OPER admin <password> on the IRCd; the same nick, once
# registered with NickServ, is Anope "Services Root". The role renders it
# as an InspIRCd hmac-sha256 hash (roles/ircd/files/inspircd_hmac.py).
vault_ircd_oper_password: "REPLACE-WITH-STRONG-PASSWORD"
# Shared secret for the InspIRCd <-> Anope server link (>= 16 chars).
vault_ircd_services_link_password: "REPLACE-WITH-RANDOM-32-CHARS"
# Shared secret for the InspIRCd <-> irc.netcrave.chat server link
# (custom.conf). Must match the remote side's recvpass/sendpass.
vault_ircd_netcrave_link_password: "REPLACE-WITH-NETCRAVE-LINK-SECRET"
# Host-cloak HMAC key (>= 30 chars). Changing it invalidates existing
# cloak-based channel bans.
vault_ircd_cloak_key: "REPLACE-WITH-RANDOM-48-CHARS"
# Dashboard oper password: the admin web UI's IRCd control session logs in
# as the least-privilege "dashboard" oper (REHASH + G/K/Z-LINE + STATS
# only, host-locked to the Docker network). The gateway receives it as
# IRCFIBER_IRCD_OPER_PASSWORD. Use a distinct random value — never reuse
# the human admin oper password.
vault_ircd_dashboard_password: "REPLACE-WITH-STRONG-PASSWORD"
# NickServ password of the #support bot nick (support_bot_nick, default
# FiberSupport). Register the nick once from the prod host before the first
# deploy (see the support-bot rollout notes); the bot sends
# `PRIVMSG NickServ :IDENTIFY FiberSupport <password>` after 001. Leave empty
# to skip IDENTIFY (the bot then falls back to FiberSupport_ on a 433).
vault_support_bot_nickserv_password: "REPLACE-WITH-STRONG-PASSWORD"
# NickServ password of the #staff log bot nick (logs_bot_nick, default
# FiberLogs). Register the nick once from the prod host before the first
# deploy (see the logs-bot rollout notes); the bot sends
# `PRIVMSG NickServ :IDENTIFY FiberLogs <password>` after 001. Leave empty
# to skip IDENTIFY (the bot then falls back to FiberLogs_ on a 433).
vault_logs_bot_nickserv_password: "REPLACE-WITH-STRONG-PASSWORD"
# Log-bot oper password: the #staff log bot OPERs as the command-less
# "fiberlogs" oper (ircd_logs_oper_name) purely to receive connect server
# notices (umode +s, snomasks c/C), host-locked to the Docker network. The
# ircd role renders it as an InspIRCd hmac-sha256 hash and the gateway
# receives it as IRCFIBER_LOGS_BOT_OPER_PASSWORD. Use a distinct random
# value — never reuse the dashboard or human admin oper password.
vault_ircd_logs_oper_password: "REPLACE-WITH-STRONG-PASSWORD"
# ipinfo.io API token, used by the #staff log bot for the geo/ASN report on
# signup and IRCd-connect IPs (7-day Redis cache). Optional: an empty value
# makes every connect/signup line render `geo unavailable` and nothing else
# degrades.
vault_ipinfo_token: "REPLACE-WITH-IPINFO-TOKEN"

# --- SigNoz query API (admin Logs page) --------------------------------------
# Service-account API key for the k8s SigNoz (mint in SigNoz UI →
# Settings → API Keys). The gateway sends it as SIGNOZ-API-KEY when
# proxying /api/admin/logs/* → Signoz query API.
# DO NOT commit the real value — use `ansible-vault edit`.
vault_signoz_api_key: "REPLACE-WITH-SIGNOZ-API-KEY"

# --- k3s backup ServiceAccount token (admin Backups page) ----------------------
# Printed by `make -f Makefile.k8s k8s-prod-backups-token` after
# `k8s-prod-backups-apply` (deploy/k8s/ircfiber-prod/rbac-backup-admin.yaml).
# Namespaced to ircfiber-prod with no delete verb. If the legacy token
# controller declines to fill the Secret, mint a time-boxed token instead
# (`kubectl -n ircfiber-prod create token ircfiber-backup-admin
# --duration=8760h`) and note the expiry date beside the value.
# DO NOT commit the real value — use `ansible-vault edit`.
vault_k3s_backup_token: ""

# --- Cloudflare Tunnel (cloudflared) -----------------------------------------
# Token for a named tunnel created in Cloudflare Zero Trust dashboard:
#   https://one.dash.cloudflare.com/ → Networks → Tunnels → Add a tunnel
# The token is available under the tunnel's "Configure" tab.
# DO NOT commit the real value — use `ansible-vault edit`.
vault_cloudflared_tunnel_token: "REPLACE-WITH-CF-TUNNEL-TOKEN"

# ── Session signing key ──────────────────────────────────────────────────────
# HMAC key for the session JWTs minted by ircfiber.api.session.
#
# REQUIRED in production. Until 2026-09-06 nothing rendered it, so session.d
# fell back to a literal that is committed to a public repository and every
# production token was forgeable by anyone who read the source. The fallback is
# now a random per-process key instead, which is safe but invalidates every
# session on restart — so an unset value here is still an operational bug, just
# no longer a security one.
#
# Generate with: openssl rand -hex 32
vault_ircfiber_jwt_secret: "REPLACE-WITH-openssl-rand-hex-32"
