---
# Per-host overrides for ircfiber-prod-1
# Tailscale MagicDNS hostname: ircfiber-prod-1.tail544547.ts.net
# Public IPv4: 47.236.247.169 (per `tailscale netcheck`)
#
# This is the combined gateway + backend + engine host (single-VM deployment).

# --- Engine (combined with gateway on this VM) ------------------------------
ircfiber_engine_id: "ovh"
ircfiber_engine_bind_address: "0.0.0.0"
ircfiber_engine_admin_port: 8091

# --- Caddy: extra public-facing hostnames -----------------------------------
# The default ircfiber_domain ("ircfiber.com") is always served. Anything
# listed here is served in ADDITION to the default. Both share the same
# per-host Caddy site blocks (one block per host), so all security headers /
# WS timeouts / CSP apply to every name.
#
# Per-host TLS is picked automatically by Caddy:
#   - *.ts.net hosts → Tailscale cert manager (real cert, no browser warning)
#   - public domains → ACME (LE) when ircfiber_use_lets_encrypt=true;
#     internal CA (self-signed) otherwise
caddy_extra_serve_hosts:
  - "ircfiber-prod-1.tail544547.ts.net"
  # www.ircfiber.com — CF A record for "www" is managed by the cloudflare role.
  # The apex "ircfiber.com" is already served via ircfiber_domain.
  - "www.ircfiber.com"

# --- TLS for the public domain ---------------------------------------------
# Enable Let's Encrypt so ircfiber.com / www.ircfiber.com get real browser-
# trusted certs once Cloudflare's DNS resolves them to this host's public
# IP. The Caddyfile uses the per-host value here.
ircfiber_use_lets_encrypt: true

cloudflare_target_ip: "47.236.247.169"

# --- Observability: Signoz OTel (production) ---------------------------------
# Gateway/engine traces/logs/metrics ship to the LOCAL signoz-ingester on
# this host via the ircfiber_logging Docker bridge (not the k3s Tailscale IP).
IRCFIBER_OTEL_ENABLED: "1"
IRCFIBER_OTEL_ENDPOINT: "http://signoz-ingester:4318"
OTEL_RESOURCE_ATTRIBUTES: "k8s.cluster.name=ircfiber-prod-1,service.name=ircfiber-gateway,deployment.environment=prod"
