---
# IRC Fiber — Deploy IRC daemon (InspIRCd 4) + services (Anope 2.1)
#
# Standalone playbook. Run from the deploy/ directory:
#
#   ansible-playbook playbooks/ircd.yml -l ircfiber-ovh-1
#
# Sets up:
#   - InspIRCd 4 container (ircfiber-ircd), aliases ircd + irc.ircfiber.com
#   - Ports 6667 (plain) and 6697 (TLS) exposed; 7000 (server links) internal
#   - One Anope 2.1 services container (ircfiber-services): NickServ,
#     ChanServ, BotServ (FIBERSERV), HostServ, MemoServ, OperServ, Global +
#     BridgeServ (Discord relay) + SASL PLAIN. JSON database (anope.json)
#     with daily/monthly backups; Bearer-token JSON-RPC for the gateway.
#   - Persistent volumes: ircfiber_inspircd_data (xlines, permchannels),
#     ircfiber_services_data (Anope JSON DB + bridge mappings)
#   - One-shot 2.0 -> 2.1 database migration when the volume still holds
#     anope.db (snapshot to /var/backups/ircfiber first; rollback in
#     README.md "Merged services")
#   - Admin oper account from vault (IRCd oper + Anope Services Root)
#   - Cloudflare DNS A record for irc.ircfiber.com
#   - UFW firewall rules for IRC ports
#
# Prerequisites: site.yml has been run (Docker, Tailscale, firewall base).

- name: Preflight — vault variables
  hosts: ircfiber
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  tasks:
    - name: Assert IRCd vault secrets are set
      ansible.builtin.assert:
        that:
          - vault_ircd_oper_password is defined
          - vault_ircd_oper_password | length > 0
          - vault_ircd_services_link_password is defined
          - vault_ircd_cloak_key is defined
        fail_msg: "vault_ircd_oper_password, vault_ircd_services_link_password and vault_ircd_cloak_key must be set in vault.yml"

- name: Manage Cloudflare DNS for irc.ircfiber.com
  hosts: ircfiber_backend
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  tasks:
    - name: Ensure irc.ircfiber.com A record exists (DNS-only, no proxy)
      community.general.cloudflare_dns:
        api_token: "{{ vault_cloudflare_api_token }}"
        zone: "{{ cloudflare_zone }}"
        record: "irc"
        type: A
        value: "{{ cloudflare_target_ip }}"
        ttl: 300
        proxied: false
        state: present
      when:
        - cloudflare_target_ip is defined
        - cloudflare_target_ip | length > 0

    # Dual-stack: once the host has a public IPv6 address, set
    # cloudflare_target_ipv6 in host_vars and re-run this playbook.
    # No-op until then (skipped when the var is undefined/empty).
    - name: Ensure irc.ircfiber.com AAAA record exists (DNS-only, no proxy)
      community.general.cloudflare_dns:
        api_token: "{{ vault_cloudflare_api_token }}"
        zone: "{{ cloudflare_zone }}"
        record: "irc"
        type: AAAA
        value: "{{ cloudflare_target_ipv6 }}"
        ttl: 300
        proxied: false
        state: present
      when:
        - cloudflare_target_ipv6 is defined
        - cloudflare_target_ipv6 | length > 0

- name: Deploy IRC daemon
  hosts: ircfiber_backend
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  roles:
    - role: ircd
