---
# Prune old irc-fiber images (keeps the N most recent tags; default 3).
# NEVER prunes volumes.

- name: Prune old irc-fiber images
  hosts: ircfiber
  become: true
  gather_facts: false
  tasks:
    - name: List irc-fiber image tags sorted by creation date
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          docker images {{ ircfiber_gateway_image_name }} \
            --format '{{ "{{" }}.Tag{{ "}}" }}\t{{ "{{" }}.CreatedAt{{ "}}" }}\t{{ "{{" }}.ID{{ "}}" }}' \
            | grep -v 'latest' \
            | sort -k2 -r
      register: image_list
      changed_when: false
      failed_when: false

    - name: Identify tags to remove
      ansible.builtin.set_fact:
        images_to_remove: >-
          {{ image_list.stdout_lines
             | default([])
             | reject('equalto', '')
             | slice(image_prune_keep_count)
             | map('split', '\t')
             | map('first')
             | reject('equalto', '<none>')
             | list }}

    - name: Prune tags
      ansible.builtin.command: docker rmi {{ ircfiber_gateway_image_name }}:{{ item }}
      loop: "{{ images_to_remove }}"
      when: images_to_remove | length > 0
      changed_when: true
      failed_when: false

    - name: Prune dangling images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: true

    # BuildKit cache only under pressure. The blanket post-deploy
    # `docker builder prune -af` that used to run guaranteed every next build
    # was cold; prod sits at ~47% of 72 GB so this normally never fires.
    - name: Read /var/lib/docker usage
      ansible.builtin.command: df --output=pcent /var/lib/docker
      register: docker_df
      changed_when: false

    - name: Prune BuildKit cache (only above 80% disk)
      ansible.builtin.command: docker builder prune -af --keep-storage 20GB
      when: (docker_df.stdout_lines | last | trim | regex_replace('%', '') | int) > 80
      changed_when: true
