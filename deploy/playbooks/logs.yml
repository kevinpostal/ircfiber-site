---
# Tail logs for a single component.
# Usage:
#   ansible-playbook playbooks/logs.yml -e component=gateway tail=200
#   ansible-playbook playbooks/logs.yml -e component=engine -l engine2.example.com
#
# Valid components: caddy, gateway, engine, mongo, redis
# Silent-drop forensics (IRC keepalive plan):
#   docker logs <engine-container> 2>&1 | grep 'component=connection' | grep 'network=<name>'
#   SigNoz: service.name=ircfiber-engine + network=<name>.
#   Look for the keepalive_missed → Disconnected (reason, pongAgeSecs,
#   dataAgeSecs, lastError) → Reconnecting / CONNECTION_RETRY_STATUS
#   sequence. keepalive_missed fires ~60 s after the last byte, the UI
#   stale hint shows at data-age 90 s, and the PONG-timeout reconnect
#   fires at ~120 s — total silent window under ~2.5 min.

- name: Tail irc-fiber logs
  hosts: all
  become: true
  gather_facts: false
  vars:
    component: "gateway"
    tail: 100
  tasks:
    - name: Validate component
      ansible.builtin.assert:
        that:
          - component in ['caddy', 'gateway', 'engine', 'mongo', 'redis']
        fail_msg: "Invalid component '{{ component }}'"

    - name: Resolve container name
      ansible.builtin.set_fact:
        target_container: "{{ 'ircfiber-engine-' + (hostvars[item].ircfiber_engine_id | default(item)) if component == 'engine' else 'ircfiber-' + component }}"
      when: component == 'engine'
      loop: "{{ groups['ircfiber_engines'] | default([]) }}"

    - name: Resolve container name (non-engine)
      ansible.builtin.set_fact:
        target_container: "ircfiber-{{ component }}"
      when: component != 'engine'

    - name: Show container log location
      ansible.builtin.debug:
        msg: "Container: {{ target_container }}"

    - name: Tail logs
      ansible.builtin.command: docker logs --tail {{ tail }} -f {{ target_container }}
      changed_when: false
