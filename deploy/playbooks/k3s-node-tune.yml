---
# IRC Fiber — kubelet tuning for the ubuntu-docker k3s node.
#
#   cd site/deploy && ansible-playbook playbooks/k3s-node-tune.yml
#
# Why this exists (2026-09-07): the node's root filesystem is the odysseus
# host's 1.7T disk, which we do not control and which routinely sits above
# 95%. kubelet's eviction threshold is a PERCENTAGE of that whole disk, so
# "5% free" means 93G — more than everything the cluster itself stores. When
# it trips, kubelet raises DiskPressure and rejects EVERY non-critical pod
# (tolerations do not help: the eviction admission handler only exempts pods
# with priority >= 2000000000, which no user-defined PriorityClass can reach),
# and the whole cluster sits Pending until someone frees host space.
#
# `kubelet-arg: eviction-hard=...` in /etc/rancher/k3s/config.yaml does NOT
# work here and was already tried: k3s renders its own kubelet config into
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/00-k3s-defaults.conf with
# `evictionHard: {nodefs.available: 5%, imagefs.available: 5%}`, and that
# config-dir value wins over the deprecated flag. Verified: with the 3% flag
# in place, the eviction manager was still reclaiming ephemeral-storage at
# 4.76% free. The supported override is another drop-in that sorts after it.
#
# The threshold alone was not enough (2026-09-13): k3s' defaults also set
# `evictionMinimumReclaim: {nodefs.available: 10%, imagefs.available: 10%}`,
# the amount kubelet must free BEYOND the threshold before it stops, so a 2%
# threshold still made it chase 12% of 1.87T (~224G) and evict every
# evictable pod on the node. The drop-in overrides that too.
#
# 2% was still a percentage of that disk (2026-09-26): ~37G, and the host
# hovers at 33–43G free, so every image build or log burst tripped it and
# evicted the irc3 bot (52Ki of ephemeral storage) five times in one
# afternoon. Absolute thresholds now: 5Gi is more headroom than the cluster
# needs to keep writing, and it only trips when the host is genuinely full.
#
# k3s on this node is not under systemd — /usr/local/bin/start.sh launches it
# with `nohup k3s server > /var/log/k3s.log 2>&1 &` — so the restart handler
# reproduces exactly that, then waits for the API to answer.
- name: Tune kubelet eviction on the k3s node
  hosts: ircfiber_k3s
  become: true
  gather_facts: false
  vars:
    k3s_kubelet_conf_d: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    k3s_config: /etc/rancher/k3s/config.yaml
  tasks:
    # Single source of truth for kubelet tuning. Ansible owns this whole file:
    # every key k3s needs on this node is here.
    - name: Write the k3s server config
      ansible.builtin.copy:
        dest: "{{ k3s_config }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by playbooks/k3s-node-tune.yml — see that file for why.
          write-kubeconfig-mode: 0644
          snapshotter: fuse-overlayfs
          secrets-encryption: true
          # Eviction tuning. The node's root filesystem is odysseus' 1.87T
          # disk, which we do not control and which sits at ~98%.
          #
          # - eviction-hard 5Gi absolute: a percentage of that disk is a
          #   moving target we cannot meet (k3s' default 5% = 93G; even 2%
          #   = 37G tripped daily at 33–43G free and evicted the irc3 bot).
          #   5Gi is more than the cluster's own write headroom.
          # - eviction-minimum-reclaim: how much MORE kubelet must free after
          #   a threshold trips before it stops evicting. k3s defaults it to
          #   10% of nodefs AND imagefs, so the eviction manager chased
          #   ~224G and evicted every evictable pod on the node in a loop
          #   at 66G free (2026-09-13). 1Gi means "get back over the line,
          #   then stop".
          # - nodefs.inodesFree is carried explicitly: eviction-hard replaces
          #   the whole map and an inode guard is worth keeping.
          #
          # These are kubelet FLAGS, not a kubelet.conf.d drop-in: the
          # deprecated flags win over config-dir values, which is why the
          # earlier 10-ircfiber-eviction.conf drop-in never took effect
          # (configz kept reporting the flag's 3% and k3s' 10% reclaim).
          kubelet-arg:
            - "eviction-hard=nodefs.available<5Gi,imagefs.available<5Gi,nodefs.inodesFree<3%"
            - "eviction-minimum-reclaim=nodefs.available=1Gi,imagefs.available=1Gi"
      notify: Restart k3s

    # Superseded by the flags above; leaving it in place would be a second,
    # silently ineffective home for the same setting.
    - name: Remove the superseded kubelet eviction drop-in
      ansible.builtin.file:
        path: "{{ k3s_kubelet_conf_d }}/10-ircfiber-eviction.conf"
        state: absent
      notify: Restart k3s

    # The config only takes effect on a kubelet start, so allow an explicit
    # bounce when the file is already correct but the running kubelet is not:
    #   ansible-playbook playbooks/k3s-node-tune.yml -e k3s_force_restart=true
    - name: Request a k3s restart
      ansible.builtin.command:
        argv: [/bin/true]
      changed_when: true
      notify: Restart k3s
      when: k3s_force_restart | default(false) | bool

    - name: Flush handlers so the verification below sees the new kubelet
      ansible.builtin.meta: flush_handlers

    - name: Read the running kubelet's effective eviction config
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          k3s kubectl get --raw "/api/v1/nodes/$(hostname)/proxy/configz" \
            | python3 -c 'import json,sys; k=json.load(sys.stdin)["kubeletconfig"]; print(json.dumps({"hard": k.get("evictionHard"), "minReclaim": k.get("evictionMinimumReclaim")}))'
        executable: /bin/bash
      register: k3s_configz
      changed_when: false
      retries: 10
      delay: 6
      until: k3s_configz.rc == 0

    # A drop-in that loses to a flag fails silently, so assert on what the
    # kubelet actually runs with rather than on the file we wrote.
    - name: Assert kubelet runs with the tuned eviction values
      ansible.builtin.assert:
        that:
          - (k3s_configz.stdout | from_json).hard['nodefs.available'] == '5Gi'
          - (k3s_configz.stdout | from_json).hard['imagefs.available'] == '5Gi'
          - (k3s_configz.stdout | from_json).minReclaim['nodefs.available'] == '1Gi'
          - (k3s_configz.stdout | from_json).minReclaim['imagefs.available'] == '1Gi'
        success_msg: "kubelet eviction: {{ k3s_configz.stdout }}"
        fail_msg: "kubelet is NOT using the tuned values: {{ k3s_configz.stdout }}"

  handlers:
    # kubelet reads its config once at start-up; k3s embeds kubelet, so the
    # whole server has to come back. Everything on this node is a Deployment,
    # StatefulSet or CronJob, so nothing is lost by the bounce.
    - name: Restart k3s
      ansible.builtin.shell:
        cmd: |
          set -u
          # The process' comm is "k3s-server", NOT "k3s", so `pkill -x k3s`
          # matches nothing (observed 2026-09-07). Its argv is also just
          # "k3s server" — start.sh execs it off PATH — so the absolute-path
          # pattern '^/usr/local/bin/k3s server$' matched nothing either and
          # this handler reported "changed" while leaving the old kubelet
          # running with the old config (observed 2026-09-13). Match the
          # argv as it actually appears, with the path optional.
          pat='^(/usr/local/bin/)?k3s server$'
          before=$(pgrep -f "$pat" | head -1)
          if [ -z "$before" ]; then
            echo "no running k3s server matched $pat"
            exit 1
          fi
          pkill -f "$pat" || true
          for i in $(seq 1 60); do
            pgrep -f "$pat" >/dev/null || break
            sleep 1
          done
          if pgrep -f "$pat" >/dev/null; then
            echo "k3s still running after SIGTERM; refusing to start a second one"
            exit 1
          fi
          # Exactly how /usr/local/bin/start.sh launches it (no systemd here).
          nohup k3s server >> /var/log/k3s.log 2>&1 &
          for i in $(seq 1 120); do
            if k3s kubectl get --raw /readyz >/dev/null 2>&1; then
              after=$(pgrep -f "$pat" | head -1)
              if [ "$after" = "$before" ]; then
                echo "k3s pid unchanged ($after): the old process survived"
                exit 1
              fi
              echo "k3s ready after ${i}s (pid $before -> $after)"
              exit 0
            fi
            sleep 1
          done
          echo "k3s did not answer /readyz within 120s"
          tail -n 30 /var/log/k3s.log
          exit 1
        executable: /bin/bash
      changed_when: true
