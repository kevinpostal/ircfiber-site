---
# Site deploy — gateway + frontend only, never touches engine
# Replaces deploy-update.yml builder aggregate. Site owns /opt/ircfiber-site
# Usage: ansible-playbook deploy/playbooks/deploy-site.yml -l vps-efb4b52d
- name: Deploy site
  hosts: "{{ target | default('ircfiber_gw') }}"
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/all.yml"
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  vars:
    src_root: /opt/ircfiber-site
    builder_image: ircfiber-builder-site
    host_bin_dir: /opt/ircfiber/bin
    ldc_version: "1.41.0"
  tasks:
    - name: Preflight — site must not define engine id (single-host allowed)
      ansible.builtin.assert:
        that: src_root == "/opt/ircfiber-site"
        fail_msg: "Site deploy src_root must be /opt/ircfiber-site"
    - name: rsync site source → {{ src_root }} (duplicated common)
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: true
        checksum: true
        rsync_opts:
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=frontend/node_modules"
          - "--exclude=.worktrees"
    - name: Build gateway image (site only)
      ansible.builtin.shell: |
        DOCKER_BUILDKIT=1 docker build           --target runtime-gateway           --build-arg GIT_HASH={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse HEAD') | default('unknown') }}           --build-arg GIT_SHORT={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse --short HEAD') | default('unknown') }}           --build-arg GIT_DESCRIBE={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ describe --always --long') | default('unknown') }}           --build-arg GIT_BRANCH={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse --abbrev-ref HEAD') | default('unknown') }}           -t kevindpostal/irc-fiber-gateway:0.3.0           -f {{ src_root }}/Containerfile.site           {{ src_root }} 2>&1
      args:
        executable: /bin/bash
      timeout: 1800
    - name: Recreate gateway container
      ansible.builtin.shell: |
        docker stop ircfiber-gateway 2>/dev/null || true
        docker rm ircfiber-gateway 2>/dev/null || true
        docker run -d --name ircfiber-gateway --restart unless-stopped --network ircfiber_net --network ircfiber_logging -v ircfiber_uploads:/app/uploads -v ircfiber_logs:/var/log/irc-fiber --env-file /etc/ircfiber/gateway/env -p 8090:8090 kevindpostal/irc-fiber-gateway:0.3.0 /app/irc-fiber
      changed_when: true
